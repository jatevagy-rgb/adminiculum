name: Safe Error Recovery Gate

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safe-error-recovery:
    name: Safe error recovery
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_at_least_32_chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Required safe-error tests
        run: npx jest --runInBand tests/safeErrorRecovery.test.ts
