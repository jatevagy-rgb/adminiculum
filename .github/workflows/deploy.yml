name: Deploy to Azure App Service (manual, sequential)

# Adminiculum production runs on Azure App Service (NOT Container Apps).
#   Backend  : prebuilt runtime artifact (built on Ubuntu / Node 20) -> Kudu ZipDeploy (Oryx OFF, prebuilt dist + node_modules).
#   Migration: canonical `adminiculum-db-migrate` triggered WebJob ONLY (no direct SQL / db push / DATABASE_URL here).
#   Frontend : Next.js standalone (.next/standalone + .next/static + public) -> ZIP -> App Service (Oryx OFF, `node server.js`).
#   Sequence : backend -> health -> (migration -> health) -> frontend -> smoke. Backend and frontend never run concurrently.
#
# Production source is ALWAYS the canonical release branch, resolved once to an immutable commit SHA that every
# job reuses, so backend + migration + frontend all belong to the SAME release commit. There is no feature-branch
# override: a hotfix must be integrated into the release branch first.
#
# This workflow is MANUAL (workflow_dispatch) on purpose: a code push must never deploy production.

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy the backend App Service.'
        type: boolean
        default: true
      run_migration:
        description: 'Run the adminiculum-db-migrate WebJob after backend deployment or verified backend recovery.'
        type: boolean
        default: false
      recovery_product_sha:
        description: 'Exact already-deployed product SHA for recovery mode (required when deploy_backend is false and run_migration is true).'
        type: string
        default: ''
      deploy_frontend:
        description: 'Deploy the frontend App Service (after backend + migration health, or against the current healthy backend when deploy_backend is off).'
        type: boolean
        default: true
      backend_recovery_action:
        description: 'P0 backend recovery action. diagnose actions are read-only; restart and redeploy_known_good require a product SHA.'
        type: choice
        options:
          - none
          - diagnose
          - diagnose_deep
          - diagnose_scanner_runtime
          - restart
          - redeploy_known_good
        default: none
      backend_recovery_product_sha:
        description: 'Exact known-good backend product SHA for restart or redeploy_known_good recovery.'
        type: string
        default: ''

# One production deployment at a time; do not cancel an in-flight deploy.
concurrency:
  group: adminiculum-appservice-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Azure federated login (no client secret).

env:
  CANONICAL_RELEASE_REF: release/editor-ops-workflow-1
  BACKEND_APP: adminiculumbackend-b1-01
  FRONTEND_APP: adminiculumfrontend-austriaeast-01
  RESOURCE_GROUP: Adminiculum
  MIGRATION_WEBJOB: adminiculum-db-migrate

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the canonical release branch to ONE immutable SHA and validate the
  # requested component combination. Every downstream job checks out this SHA.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve release SHA + validate inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      build_time: ${{ steps.rev.outputs.build_time }}
      product_sha: ${{ steps.product.outputs.sha }}
    steps:
      - name: Validate component inputs
        run: |
          set -euo pipefail
          ACTION="${BACKEND_RECOVERY_ACTION}"
          if [ "$ACTION" != "none" ]; then
            [ "${{ inputs.run_migration }}" = "false" ] || { echo "Backend recovery never runs migrations."; exit 1; }
            [ "${{ inputs.deploy_frontend }}" = "false" ] || { echo "Backend recovery never deploys the frontend."; exit 1; }
            case "$ACTION" in
              diagnose|diagnose_deep|diagnose_scanner_runtime)
                [ "${{ inputs.deploy_backend }}" = "false" ] || { echo "diagnose must not deploy the backend."; exit 1; }
                [ -z "$BACKEND_RECOVERY_PRODUCT_SHA" ] || { echo "diagnose does not accept a product SHA."; exit 1; }
                ;;
              restart)
                [ "${{ inputs.deploy_backend }}" = "false" ] || { echo "restart must not deploy the backend."; exit 1; }
                ;;
              redeploy_known_good)
                [ "${{ inputs.deploy_backend }}" = "true" ] || { echo "redeploy_known_good requires deploy_backend=true."; exit 1; }
                ;;
              *) echo "Unsupported backend recovery action: $ACTION"; exit 1 ;;
            esac
            if [ "$ACTION" != "diagnose" ] && [ "$ACTION" != "diagnose_deep" ] && [ "$ACTION" != "diagnose_scanner_runtime" ]; then
              [[ "$BACKEND_RECOVERY_PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Recovery product SHA must be exactly 40 lowercase hexadecimal characters."; exit 1; }
            fi
            echo "P0 backend recovery inputs OK (action=$ACTION)."
            exit 0
          fi
          if [ "${{ inputs.deploy_backend }}" != "true" ] && [ "${{ inputs.deploy_frontend }}" != "true" ]; then
            echo "Nothing to deploy: enable deploy_backend and/or deploy_frontend."; exit 1
          fi
          # Recovery migration is valid only with the frontend enabled so the
          # manual release sequence remains explicit and fully gated.
          if [ "${{ inputs.run_migration }}" = "true" ] && [ "${{ inputs.deploy_backend }}" != "true" ] && [ "${{ inputs.deploy_frontend }}" != "true" ]; then
            echo "run_migration=true without backend deployment requires deploy_frontend=true recovery path."; exit 1
          fi
          echo "Inputs OK (backend=${{ inputs.deploy_backend }}, migration=${{ inputs.run_migration }}, frontend=${{ inputs.deploy_frontend }})."
        env:
          BACKEND_RECOVERY_ACTION: ${{ inputs.backend_recovery_action }}
          BACKEND_RECOVERY_PRODUCT_SHA: ${{ inputs.backend_recovery_product_sha }}

      - uses: actions/checkout@v4
        with:
          ref: release/editor-ops-workflow-1
          fetch-depth: 0

      - name: Resolve canonical release branch to an immutable SHA
        id: rev
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "Resolved ${CANONICAL_RELEASE_REF} -> $SHA"
          echo "Release build time: $BUILD_TIME"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Resolve product SHA for this release mode
        id: product
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_SHA="${{ steps.rev.outputs.sha }}"
          RECOVERY_SHA="${RECOVERY_PRODUCT_SHA_INPUT}"
          BACKEND_RECOVERY_ACTION="${BACKEND_RECOVERY_ACTION_INPUT}"
          BACKEND_RECOVERY_SHA="${BACKEND_RECOVERY_SHA_INPUT}"
          if [ "$BACKEND_RECOVERY_ACTION" != "none" ]; then
            if [ "$BACKEND_RECOVERY_ACTION" = "diagnose" ] || [ "$BACKEND_RECOVERY_ACTION" = "diagnose_deep" ] || [ "$BACKEND_RECOVERY_ACTION" = "diagnose_scanner_runtime" ]; then
              PRODUCT_SHA="$CONTROL_SHA"
            else
              [[ "$BACKEND_RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Recovery product SHA must be exactly 40 lowercase hexadecimal characters."; exit 1; }
              git cat-file -e "${BACKEND_RECOVERY_SHA}^{commit}" || { echo "Recovery product SHA is not reachable from the canonical release branch."; exit 1; }
              git merge-base --is-ancestor "$BACKEND_RECOVERY_SHA" "$CONTROL_SHA" || {
                echo "Recovery product SHA must be an ancestor of the workflow control SHA."; exit 1
              }
              PRODUCT_SHA="$BACKEND_RECOVERY_SHA"
            fi
          elif [ "${{ inputs.deploy_backend }}" = "true" ]; then
            if [ -n "$RECOVERY_SHA" ]; then
              echo "recovery_product_sha must be empty when deploy_backend=true."; exit 1
            fi
            PRODUCT_SHA="$CONTROL_SHA"
          elif [ "${{ inputs.run_migration }}" = "true" ]; then
            if [[ ! "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "recovery_product_sha must be exactly 40 lowercase hexadecimal characters in recovery mode."; exit 1
            fi
            git cat-file -e "${RECOVERY_SHA}^{commit}" || { echo "recovery_product_sha is not a commit reachable from the canonical release branch."; exit 1; }
            git merge-base --is-ancestor "$RECOVERY_SHA" "$CONTROL_SHA" || {
              echo "recovery_product_sha must be an ancestor of the workflow control SHA."; exit 1
            }
            PRODUCT_SHA="$RECOVERY_SHA"
          else
            PRODUCT_SHA="$CONTROL_SHA"
          fi
          echo "Resolved product SHA: $PRODUCT_SHA"
          echo "sha=$PRODUCT_SHA" >> "$GITHUB_OUTPUT"
        env:
          RECOVERY_PRODUCT_SHA_INPUT: ${{ inputs.recovery_product_sha }}
          BACKEND_RECOVERY_ACTION_INPUT: ${{ inputs.backend_recovery_action }}
          BACKEND_RECOVERY_SHA_INPUT: ${{ inputs.backend_recovery_product_sha }}

  # ---------------------------------------------------------------------------
  # P0 availability recovery is deliberately separate from normal release
  # sequencing. It uses OIDC, reports current App Service/Kudu state, and
  # rejects migration and frontend inputs during validation above.
  # ---------------------------------------------------------------------------
  recovery_inspection:
    name: Inspect backend recovery state
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ inputs.backend_recovery_action != 'none' }}
    environment: production
    steps:
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect App Service and Kudu deployment records
        if: ${{ inputs.backend_recovery_action != 'diagnose_scanner_runtime' }}
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp show --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" \
              --query '{appState:state,host:defaultHostName,kind:kind}' --output json
            # This is an observation-only snapshot. It is never used to infer
            # a successful deployment identity or to select an artifact.
            az webapp log deployment list --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" \
              --query '[0:10].{id:id,status:status,active:active,startTime:startTime,endTime:endTime,deployer:deployer}' --output json

      - name: Inspect exact Kudu deployment and runtime diagnostics (read-only)
        if: ${{ inputs.backend_recovery_action == 'diagnose_deep' }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --query accessToken -o tsv)"
          KUDU="https://${BACKEND_APP}.scm.azurewebsites.net/api"
          export TOKEN KUDU
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/deployments" > deployments.json
          python3 - <<'PY'
          import json, re
          def scrub(value):
              text = str(value or '')
              text = re.sub(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+', r'\1\2***', text)
              text = re.sub(r'(?i)(https?://)[^\s/@:]+:[^\s/@]+@', r'\1***:***@', text)
              return text
          deployments = json.load(open('deployments.json'))
          selected = [{key: scrub(item.get(key)) for key in ('id', 'status', 'message', 'author', 'start_time', 'end_time', 'active', 'deployer')} for item in deployments[:5]]
          print(json.dumps(selected, indent=2))
          PY
          DEPLOYMENT_ID="$(python3 -c 'import json; print(json.load(open("deployments.json"))[0]["id"])')"
          export DEPLOYMENT_ID
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/deployments/${DEPLOYMENT_ID}/log" > deployment-log.json
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          def scrub(value):
              text = str(value or '')
              text = re.sub(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+', r'\1\2***', text)
              text = re.sub(r'(?i)(https?://)[^\s/@:]+:[^\s/@]+@', r'\1***:***@', text)
              return text
          logs = json.load(open('deployment-log.json'))
          selected = [{key: scrub(item.get(key)) for key in ('id', 'message', 'type', 'details_url', 'log_time')} for item in logs]
          print(json.dumps(selected, indent=2))
          base = urllib.parse.urlparse(os.environ['KUDU'])
          for item in logs:
              detail = item.get('details_url')
              if not detail:
                  continue
              url = urllib.parse.urljoin(os.environ['KUDU'] + '/', detail)
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.netloc != base.netloc or not parsed.path.startswith('/api/'):
                  raise RuntimeError('Unexpected Kudu deployment detail URL.')
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode('utf-8', errors='replace')
              print(f'DEPLOYMENT_LOG_DETAIL_{item.get("id", "unknown")}={scrub(text)}')
          PY
          for ARTIFACT_PATH in package.json dist/index.js node_modules release-identity.json; do
            CODE="$(curl -sS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/vfs/site/wwwroot/${ARTIFACT_PATH}" -o /dev/null -w '%{http_code}')"
            echo "WWWROOT_${ARTIFACT_PATH//\//_}_HTTP=${CODE}"
          done
          set +e
          az webapp log download --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --log-file runtime-logs.zip
          LOG_DOWNLOAD_STATUS=$?
          set -e
          echo "RUNTIME_LOG_DOWNLOAD_STATUS=${LOG_DOWNLOAD_STATUS}"
          if [ "$LOG_DOWNLOAD_STATUS" = "0" ]; then
            unzip -Z1 runtime-logs.zip | sed -n '1,100p'
            python3 - <<'PY'
          import re, zipfile
          secret = re.compile(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+')
          with zipfile.ZipFile('runtime-logs.zip') as archive:
              names = [n for n in archive.namelist() if not n.endswith('/')]
              for name in names:
                  if '2026_09_04' in name or 'StartupLogs' in name:
                      lines = [secret.sub(r'\1\2***', l) for l in archive.read(name).decode('utf-8', errors='replace').splitlines()]
                      print(f"=== RECENT LOG: {name} (last 40 of {len(lines)} lines) ===")
                      for l in lines[-40:]:
                          print(f"[{name}] {l}")
          PY
          fi
          # -------------------------------------------------------------------
          # Live SharePoint / Microsoft Graph credential inventory & token probe
          # -------------------------------------------------------------------
          set +e
          az webapp config appsettings list --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --output json > backend-appsettings.json
          APP_SETTINGS_STATUS=$?
          set -e
          if [ "$APP_SETTINGS_STATUS" = "0" ]; then
            python3 - <<'PY'
          import json, re, urllib.request, urllib.parse, urllib.error

          settings_list = json.load(open('backend-appsettings.json'))
          app_settings = {item.get('name'): str(item.get('value') or '') for item in settings_list if item.get('name')}

          def is_present(k):
              val = app_settings.get(k, '')
              return 'PRESENT' if val.strip() else 'MISSING'

          print("=== STEP 1: SHAREPOINT CONFIG INVENTORY ===")
          target_keys = [
              'SP_CLIENT_ID', 'SP_CLIENT_SECRET', 'SP_TENANT_ID',
              'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_TENANT_ID',
              'SP_SITE_ID', 'SHAREPOINT_SITE_ID',
              'SHAREPOINT_SITE_URL', 'SP_SITE_URL',
              'SP_DRIVE_ID', 'SHAREPOINT_DRIVE_ID'
          ]
          for k in target_keys:
              print(f"{k}: {is_present(k)}")

          sp_cid = app_settings.get('SP_CLIENT_ID', '').strip()
          az_cid = app_settings.get('AZURE_CLIENT_ID', '').strip()
          eff_cid = sp_cid or az_cid
          eff_cid_src = 'SP_CLIENT_ID' if sp_cid else ('AZURE_CLIENT_ID' if az_cid else 'NONE')

          sp_sec = app_settings.get('SP_CLIENT_SECRET', '').strip()
          az_sec = app_settings.get('AZURE_CLIENT_SECRET', '').strip()
          eff_sec = sp_sec or az_sec
          eff_sec_src = 'SP_CLIENT_SECRET' if sp_sec else ('AZURE_CLIENT_SECRET' if az_sec else 'NONE')

          sp_tid = app_settings.get('SP_TENANT_ID', '').strip()
          az_tid = app_settings.get('AZURE_TENANT_ID', '').strip()
          eff_tid = sp_tid or az_tid
          eff_tid_src = 'SP_TENANT_ID' if sp_tid else ('AZURE_TENANT_ID' if az_tid else 'NONE')

          sources = {eff_cid_src, eff_sec_src, eff_tid_src} - {'NONE'}
          is_mixed = len(sources) > 1

          print("\n=== CREDENTIAL RESOLUTION ===")
          print(f"EFFECTIVE CLIENT ID SOURCE: {eff_cid_src}")
          print(f"EFFECTIVE CLIENT SECRET SOURCE: {eff_sec_src}")
          print(f"EFFECTIVE TENANT SOURCE: {eff_tid_src}")
          print(f"MIXED CREDENTIAL SET: {'YES' if is_mixed else 'NO'}")

          def probe_token(label, tenant_id, client_id, client_secret):
              if not tenant_id or not client_id or not client_secret:
                  print(f"\n[{label}] SKIP: Incomplete credentials")
                  return False, None
              print(f"\n=== TOKEN PROBE: {label} ===")
              url = f"https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token"
              body = urllib.parse.urlencode({
                  'client_id': client_id,
                  'client_secret': client_secret,
                  'scope': 'https://graph.microsoft.com/.default',
                  'grant_type': 'client_credentials'
              }).encode('utf-8')
              req = urllib.request.Request(url, data=body, headers={'Content-Type': 'application/x-www-form-urlencoded'})
              try:
                  with urllib.request.urlopen(req) as resp:
                      status = resp.getcode()
                      data = json.loads(resp.read().decode('utf-8'))
                      token = data.get('access_token')
                      print(f"[{label}] TOKEN HTTP STATUS: {status}")
                      print(f"[{label}] TOKEN RESULT: SUCCESS")
                      return True, token
              except urllib.error.HTTPError as e:
                  status = e.code
                  resp_text = e.read().decode('utf-8', errors='replace')
                  oauth_error = "UNKNOWN"
                  aadsts = "NONE"
                  sanitized_desc = ""
                  try:
                      err_json = json.loads(resp_text)
                      oauth_error = err_json.get('error', 'UNKNOWN')
                      desc = err_json.get('error_description', '')
                      m = re.search(r'AADSTS\d+', desc)
                      if m:
                          aadsts = m.group(0)
                      first_line = desc.split('\r\n')[0].split('\n')[0]
                      sanitized_desc = re.sub(r'[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}', '<GUID>', first_line)
                  except Exception as ex:
                      sanitized_desc = f"Parsing error: {ex}"
                  print(f"[{label}] TOKEN HTTP STATUS: {status}")
                  print(f"[{label}] OAUTH ERROR: {oauth_error}")
                  print(f"[{label}] AADSTS CODE: {aadsts}")
                  print(f"[{label}] SANITIZED ERROR DESCRIPTION: {sanitized_desc}")
                  return False, None

          eff_ok, eff_token = probe_token("EFFECTIVE", eff_tid, eff_cid, eff_sec)
          az_ok, az_token = probe_token("AZURE_TRIPLET", az_tid, az_cid, az_sec)

          if az_ok and az_token:
              print("\n=== SHAREPOINT RESOURCE PROBES VIA AZURE_TRIPLET TOKEN ===")
              site_ok = False
              drive_ok = False
              root_ok = False

              sp_site_id = app_settings.get('SP_SITE_ID', '').strip()
              sp_drive_id = app_settings.get('SP_DRIVE_ID', '').strip()

              def probe_graph(name, endpoint):
                  req = urllib.request.Request(endpoint, headers={'Authorization': f'Bearer {az_token}', 'Accept': 'application/json'})
                  try:
                      with urllib.request.urlopen(req) as resp:
                          st = resp.getcode()
                          data = json.loads(resp.read().decode('utf-8'))
                          item_id = data.get('id', '')
                          item_name = data.get('displayName') or data.get('name') or ''
                          print(f"[{name}] HTTP STATUS: {st} | RESOLVED: YES | ID: {item_id[:12]}... | NAME: {item_name}")
                          return True
                  except urllib.error.HTTPError as he:
                      print(f"[{name}] HTTP STATUS: {he.code} | ERROR: {he.read().decode('utf-8', errors='replace')[:200]}")
                      return False
                  except Exception as ex:
                      print(f"[{name}] EXCEPTION: {ex}")
                      return False

              if sp_site_id:
                  site_ok = probe_graph("SITE_BY_ID", f"https://graph.microsoft.com/v1.0/sites/{sp_site_id}")

              if sp_drive_id:
                  drive_ok = probe_graph("DRIVE_BY_ID", f"https://graph.microsoft.com/v1.0/drives/{sp_drive_id}")
                  root_ok = probe_graph("ROOT_FOLDER", f"https://graph.microsoft.com/v1.0/drives/{sp_drive_id}/root")

              print(f"SITE RESOLVABLE: {'YES' if site_ok else 'NO'}")
              print(f"DRIVE RESOLVABLE: {'YES' if drive_ok else 'NO'}")
              print(f"ROOT FOLDER RESOLVABLE: {'YES' if root_ok else 'NO'}")

              if not eff_ok and az_ok and site_ok and drive_ok and root_ok:
                  open('/tmp/sharepoint_ready_to_repair.txt', 'w').write('READY')
                  print("\nSAFE REPAIR PROVEN: Obsolete SP_* overrides can safely be deleted.")
          PY

          if [ -f /tmp/sharepoint_ready_to_repair.txt ]; then
            echo "=== STEP 4: APPLYING CONFIG-ONLY REPAIR ==="
            az webapp config appsettings delete --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --setting-names SP_CLIENT_ID SP_CLIENT_SECRET SP_TENANT_ID
            echo "CONFIG CHANGE APPLIED: Deleted obsolete SP_* overrides."
          fi

          # -------------------------------------------------------------------
          # Step 4b: Inspect /home/site/wwwroot via Kudu command & heal runtime node_modules
          # -------------------------------------------------------------------
          python3 - <<'PY'
          import json, os, urllib.request

          kudu = os.environ['KUDU']
          token = os.environ['TOKEN']

          def run_kudu_bash(cmd_str):
              url = f"{kudu}/command"
              body = json.dumps({"command": f"bash -c {json.dumps(cmd_str)}", "dir": "/home/site/wwwroot"}).encode('utf-8')
              req = urllib.request.Request(url, data=body, headers={
                  'Authorization': f"Bearer {token}",
                  'Content-Type': 'application/json'
              })
              try:
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      res = json.loads(resp.read().decode('utf-8'))
                      out = (res.get('Output') or '').strip()
                      err = (res.get('Error') or '').strip()
                      exit_code = res.get('ExitCode')
                      print(f"[KUDU BASH: {cmd_str[:60]}] Exit: {exit_code}")
                      if out:
                          print(f"OUT:\n{out[:500]}")
                      if err:
                          print(f"ERR:\n{err[:500]}")
                      return res
              except Exception as e:
                  print(f"[KUDU BASH: {cmd_str[:60]}] EXCEPTION: {e}")
                  return None

          print("\n=== KUDU SITE ROOT INSPECTION ===")
          run_kudu_bash("ls -la")
          res_exp = run_kudu_bash("test -f node_modules/express/package.json && echo 'EXPRESS_FOUND' || echo 'EXPRESS_MISSING'")
          has_express = res_exp and 'EXPRESS_FOUND' in (res_exp.get('Output') or '')
          print(f"EXPRESS FOUND: {has_express}")

          print("=== LATEST DOCKER LOG FROM /home/LogFiles ===")
          run_kudu_bash("tail -n 80 /home/LogFiles/$(ls -t /home/LogFiles | grep default_docker | head -n 1)")

          print("=== NODE TEST LOAD ./dist/index.js ===")
          run_kudu_bash("node -e \"try { require('./dist/index.js'); } catch (e) { console.error('STARTUP_TEST_ERROR:', e.stack || e); }\"")

          if not has_express:
              print("\nRepairing node_modules in /home/site/wwwroot...")
              print("Step A: extract node_modules.tar.gz directly in /home/site/wwwroot...")
              run_kudu_bash("tar -xzf node_modules.tar.gz")
              res_chk = run_kudu_bash("test -f node_modules/express/package.json && echo 'FOUND' || echo 'MISSING'")
              if res_chk and 'FOUND' in (res_chk.get('Output') or ''):
                  print("Express found after direct tar extraction.")
                  open('/tmp/node_modules_healed.txt', 'w').write('HEALED')
              else:
                  print("Step B: extract with -C node_modules...")
                  run_kudu_bash("mkdir -p node_modules")
                  run_kudu_bash("tar -xzf node_modules.tar.gz -C node_modules")
                  res_chk2 = run_kudu_bash("test -f node_modules/express/package.json && echo 'FOUND' || echo 'MISSING'")
