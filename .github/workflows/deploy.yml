name: Deploy to Azure App Service (manual, sequential)

# Adminiculum production runs on Azure App Service (NOT Container Apps).
#   Backend  : source ZIP (package.json at archive ROOT) -> Kudu ZipDeploy -> Oryx Linux server-side build.
#   Migration: canonical `adminiculum-db-migrate` triggered WebJob ONLY (no direct SQL / db push / DATABASE_URL here).
#   Frontend : Next.js standalone (.next/standalone + .next/static + public) -> ZIP -> App Service (Oryx OFF, `node server.js`).
#   Sequence : backend -> health -> (migration -> health) -> frontend -> smoke. Backend and frontend never run concurrently.
#
# Production source is ALWAYS the canonical release branch, resolved once to an immutable commit SHA that every
# job reuses, so backend + migration + frontend all belong to the SAME release commit. There is no feature-branch
# override: a hotfix must be integrated into the release branch first.
#
# This workflow is MANUAL (workflow_dispatch) on purpose: a code push must never deploy production.

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy the backend App Service.'
        type: boolean
        default: true
      run_migration:
        description: 'Run the adminiculum-db-migrate WebJob after backend deployment or verified backend recovery.'
        type: boolean
        default: false
      recovery_product_sha:
        description: 'Exact already-deployed product SHA for recovery mode (required when deploy_backend is false and run_migration is true).'
        type: string
        default: ''
      deploy_frontend:
        description: 'Deploy the frontend App Service (after backend + migration health, or against the current healthy backend when deploy_backend is off).'
        type: boolean
        default: true
      backend_recovery_action:
        description: 'P0 backend recovery action. diagnose actions are read-only; restart and redeploy_known_good require a product SHA.'
        type: choice
        options:
          - none
          - diagnose
          - diagnose_deep
          - restart
          - redeploy_known_good
        default: none
      backend_recovery_product_sha:
        description: 'Exact known-good backend product SHA for restart or redeploy_known_good recovery.'
        type: string
        default: ''

# One production deployment at a time; do not cancel an in-flight deploy.
concurrency:
  group: adminiculum-appservice-production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Azure federated login (no client secret).

env:
  CANONICAL_RELEASE_REF: release/editor-ops-workflow-1
  BACKEND_APP: adminiculumbackend-b1-01
  FRONTEND_APP: adminiculumfrontend-austriaeast-01
  RESOURCE_GROUP: Adminiculum
  MIGRATION_WEBJOB: adminiculum-db-migrate

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the canonical release branch to ONE immutable SHA and validate the
  # requested component combination. Every downstream job checks out this SHA.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve release SHA + validate inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      build_time: ${{ steps.rev.outputs.build_time }}
      product_sha: ${{ steps.product.outputs.sha }}
    steps:
      - name: Validate component inputs
        run: |
          set -euo pipefail
          ACTION="${BACKEND_RECOVERY_ACTION}"
          if [ "$ACTION" != "none" ]; then
            [ "${{ inputs.run_migration }}" = "false" ] || { echo "Backend recovery never runs migrations."; exit 1; }
            [ "${{ inputs.deploy_frontend }}" = "false" ] || { echo "Backend recovery never deploys the frontend."; exit 1; }
            case "$ACTION" in
              diagnose|diagnose_deep)
                [ "${{ inputs.deploy_backend }}" = "false" ] || { echo "diagnose must not deploy the backend."; exit 1; }
                [ -z "$BACKEND_RECOVERY_PRODUCT_SHA" ] || { echo "diagnose does not accept a product SHA."; exit 1; }
                ;;
              restart)
                [ "${{ inputs.deploy_backend }}" = "false" ] || { echo "restart must not deploy the backend."; exit 1; }
                ;;
              redeploy_known_good)
                [ "${{ inputs.deploy_backend }}" = "true" ] || { echo "redeploy_known_good requires deploy_backend=true."; exit 1; }
                ;;
              *) echo "Unsupported backend recovery action: $ACTION"; exit 1 ;;
            esac
            if [ "$ACTION" != "diagnose" ] && [ "$ACTION" != "diagnose_deep" ]; then
              [[ "$BACKEND_RECOVERY_PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Recovery product SHA must be exactly 40 lowercase hexadecimal characters."; exit 1; }
            fi
            echo "P0 backend recovery inputs OK (action=$ACTION)."
            exit 0
          fi
          if [ "${{ inputs.deploy_backend }}" != "true" ] && [ "${{ inputs.deploy_frontend }}" != "true" ]; then
            echo "Nothing to deploy: enable deploy_backend and/or deploy_frontend."; exit 1
          fi
          # Recovery migration is valid only with the frontend enabled so the
          # manual release sequence remains explicit and fully gated.
          if [ "${{ inputs.run_migration }}" = "true" ] && [ "${{ inputs.deploy_backend }}" != "true" ] && [ "${{ inputs.deploy_frontend }}" != "true" ]; then
            echo "run_migration=true without backend deployment requires deploy_frontend=true recovery path."; exit 1
          fi
          echo "Inputs OK (backend=${{ inputs.deploy_backend }}, migration=${{ inputs.run_migration }}, frontend=${{ inputs.deploy_frontend }})."
        env:
          BACKEND_RECOVERY_ACTION: ${{ inputs.backend_recovery_action }}
          BACKEND_RECOVERY_PRODUCT_SHA: ${{ inputs.backend_recovery_product_sha }}

      - uses: actions/checkout@v4
        with:
          ref: release/editor-ops-workflow-1
          fetch-depth: 0

      - name: Resolve canonical release branch to an immutable SHA
        id: rev
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%S.%3NZ")
          echo "Resolved ${CANONICAL_RELEASE_REF} -> $SHA"
          echo "Release build time: $BUILD_TIME"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"

      - name: Resolve product SHA for this release mode
        id: product
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_SHA="${{ steps.rev.outputs.sha }}"
          RECOVERY_SHA="${RECOVERY_PRODUCT_SHA_INPUT}"
          BACKEND_RECOVERY_ACTION="${BACKEND_RECOVERY_ACTION_INPUT}"
          BACKEND_RECOVERY_SHA="${BACKEND_RECOVERY_SHA_INPUT}"
          if [ "$BACKEND_RECOVERY_ACTION" != "none" ]; then
            if [ "$BACKEND_RECOVERY_ACTION" = "diagnose" ] || [ "$BACKEND_RECOVERY_ACTION" = "diagnose_deep" ]; then
              PRODUCT_SHA="$CONTROL_SHA"
            else
              [[ "$BACKEND_RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Recovery product SHA must be exactly 40 lowercase hexadecimal characters."; exit 1; }
              git cat-file -e "${BACKEND_RECOVERY_SHA}^{commit}" || { echo "Recovery product SHA is not reachable from the canonical release branch."; exit 1; }
              git merge-base --is-ancestor "$BACKEND_RECOVERY_SHA" "$CONTROL_SHA" || {
                echo "Recovery product SHA must be an ancestor of the workflow control SHA."; exit 1
              }
              PRODUCT_SHA="$BACKEND_RECOVERY_SHA"
            fi
          elif [ "${{ inputs.deploy_backend }}" = "true" ]; then
            if [ -n "$RECOVERY_SHA" ]; then
              echo "recovery_product_sha must be empty when deploy_backend=true."; exit 1
            fi
            PRODUCT_SHA="$CONTROL_SHA"
          elif [ "${{ inputs.run_migration }}" = "true" ]; then
            if [[ ! "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "recovery_product_sha must be exactly 40 lowercase hexadecimal characters in recovery mode."; exit 1
            fi
            git cat-file -e "${RECOVERY_SHA}^{commit}" || { echo "recovery_product_sha is not a commit reachable from the canonical release branch."; exit 1; }
            git merge-base --is-ancestor "$RECOVERY_SHA" "$CONTROL_SHA" || {
              echo "recovery_product_sha must be an ancestor of the workflow control SHA."; exit 1
            }
            PRODUCT_SHA="$RECOVERY_SHA"
          else
            PRODUCT_SHA="$CONTROL_SHA"
          fi
          echo "Resolved product SHA: $PRODUCT_SHA"
          echo "sha=$PRODUCT_SHA" >> "$GITHUB_OUTPUT"
        env:
          RECOVERY_PRODUCT_SHA_INPUT: ${{ inputs.recovery_product_sha }}
          BACKEND_RECOVERY_ACTION_INPUT: ${{ inputs.backend_recovery_action }}
          BACKEND_RECOVERY_SHA_INPUT: ${{ inputs.backend_recovery_product_sha }}

  # ---------------------------------------------------------------------------
  # P0 availability recovery is deliberately separate from normal release
  # sequencing. It uses OIDC, reports current App Service/Kudu state, and
  # rejects migration and frontend inputs during validation above.
  # ---------------------------------------------------------------------------
  recovery_inspection:
    name: Inspect backend recovery state
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ inputs.backend_recovery_action != 'none' }}
    environment: production
    steps:
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect App Service and Kudu deployment records
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp show --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" \
              --query '{appState:state,host:defaultHostName,kind:kind}' --output json
            # This is an observation-only snapshot. It is never used to infer
            # a successful deployment identity or to select an artifact.
            az webapp log deployment list --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" \
              --query '[0:10].{id:id,status:status,active:active,startTime:startTime,endTime:endTime,deployer:deployer}' --output json

      - name: Inspect exact Kudu deployment and runtime diagnostics (read-only)
        if: ${{ inputs.backend_recovery_action == 'diagnose_deep' }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --query accessToken -o tsv)"
          KUDU="https://${BACKEND_APP}.scm.azurewebsites.net/api"
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/deployments" > deployments.json
          python3 - <<'PY'
          import json, re
          def scrub(value):
              text = str(value or '')
              text = re.sub(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+', r'\1\2***', text)
              text = re.sub(r'(?i)(https?://)[^\s/@:]+:[^\s/@]+@', r'\1***:***@', text)
              return text
          deployments = json.load(open('deployments.json'))
          selected = [{key: scrub(item.get(key)) for key in ('id', 'status', 'message', 'author', 'start_time', 'end_time', 'active', 'deployer')} for item in deployments[:5]]
          print(json.dumps(selected, indent=2))
          PY
          DEPLOYMENT_ID="$(python3 -c 'import json; print(json.load(open("deployments.json"))[0]["id"])')"
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/deployments/${DEPLOYMENT_ID}/log" > deployment-log.json
          DEPLOYMENT_ID="$DEPLOYMENT_ID" KUDU="$KUDU" TOKEN="$TOKEN" python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          def scrub(value):
              text = str(value or '')
              text = re.sub(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+', r'\1\2***', text)
              text = re.sub(r'(?i)(https?://)[^\s/@:]+:[^\s/@]+@', r'\1***:***@', text)
              return text
          logs = json.load(open('deployment-log.json'))
          selected = [{key: scrub(item.get(key)) for key in ('id', 'message', 'type', 'details_url', 'log_time')} for item in logs]
          print(json.dumps(selected, indent=2))
          base = urllib.parse.urlparse(os.environ['KUDU'])
          for item in logs:
              detail = item.get('details_url')
              if not detail:
                  continue
              url = urllib.parse.urljoin(os.environ['KUDU'] + '/', detail)
              parsed = urllib.parse.urlparse(url)
              if parsed.scheme != 'https' or parsed.netloc != base.netloc or not parsed.path.startswith('/api/'):
                  raise RuntimeError('Unexpected Kudu deployment detail URL.')
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['TOKEN']})
              with urllib.request.urlopen(request, timeout=30) as response:
                  text = response.read().decode('utf-8', errors='replace')
              print(f'DEPLOYMENT_LOG_DETAIL_{item.get("id", "unknown")}={scrub(text)}')
          PY
          for ARTIFACT_PATH in package.json dist/index.js node_modules release-identity.json; do
            CODE="$(curl -sS -m 30 -H "Authorization: Bearer ${TOKEN}" "${KUDU}/vfs/site/wwwroot/${ARTIFACT_PATH}" -o /dev/null -w '%{http_code}')"
            echo "WWWROOT_${ARTIFACT_PATH//\//_}_HTTP=${CODE}"
          done
          set +e
          az webapp log download --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --log-file runtime-logs.zip
          LOG_DOWNLOAD_STATUS=$?
          set -e
          echo "RUNTIME_LOG_DOWNLOAD_STATUS=${LOG_DOWNLOAD_STATUS}"
          if [ "$LOG_DOWNLOAD_STATUS" = "0" ]; then
            unzip -Z1 runtime-logs.zip | sed -n '1,100p'
            python3 - <<'PY'
          import re, zipfile
          pattern = re.compile(r'error|fail|exception|crash|oom|out of memory|startup|oryx|npm|prisma', re.I)
          secret = re.compile(r'(?i)(password|token|secret|key|authorization|database_url)(\s*[:=]\s*)\S+')
          with zipfile.ZipFile('runtime-logs.zip') as archive:
              for name in archive.namelist():
                  if name.endswith('/'):
                      continue
                  text = archive.read(name).decode('utf-8', errors='replace')
                  matches = [secret.sub(r'\1\2***', line) for line in text.splitlines() if pattern.search(line)]
                  for line in matches[-40:]:
                      print(f'RUNTIME_LOG[{name}]={line}')
          PY
          fi
          az webapp config show --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --query '{startup:appCommandLine,linuxFxVersion:linuxFxVersion}' --output json
          az webapp config appsettings list --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --query "[?name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='WEBSITE_RUN_FROM_PACKAGE'].{name:name,present:value!=null}" --output json
          # Scanner diagnosis is deliberately observation-only. Settings are read
          # into a local file and reduced to presence/masked-host facts before output.
          az webapp config appsettings list --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" > scanner-settings.json
          python3 - <<'PY'
          import json, os, sys, urllib.parse
          settings = {item.get('name'): item.get('value') for item in json.load(open('scanner-settings.json'))}
          mode = str(settings.get('WORKFORCE_MALWARE_SCANNER') or '').strip().lower()
          url = str(settings.get('WORKFORCE_MALWARE_SCANNER_URL') or '').strip()
          auth = str(settings.get('WORKFORCE_MALWARE_SCANNER_API_KEY') or '').strip()
          timeout = str(settings.get('WORKFORCE_MALWARE_SCANNER_TIMEOUT_MS') or '').strip()
          parsed = urllib.parse.urlparse(url)
          if url and (not parsed.scheme or not parsed.hostname):
              raise SystemExit('Scanner URL is configured but is not an absolute URL.')
          origin = f'{parsed.scheme}://{parsed.netloc}' if url else ''
          for value in (url, auth, timeout):
              if value:
                  print(f'::add-mask::{value}')
          print(f'WORKFORCE_MALWARE_SCANNER={mode or "NONE"}')
          print(f'WORKFORCE_MALWARE_SCANNER_URL_PRESENT={"YES" if url else "NO"}')
          print(f'WORKFORCE_MALWARE_SCANNER_HOST={parsed.netloc if url else "NOT_CONFIGURED"}')
          print(f'WORKFORCE_MALWARE_SCANNER_AUTH_PRESENT={"YES" if auth else "NO"}')
          print(f'WORKFORCE_MALWARE_SCANNER_TIMEOUT_PRESENT={"YES" if timeout else "NO"}')
          open('scanner-origin.txt', 'w').write(origin)
          PY
          ORIGIN="$(cat scanner-origin.txt)"
          if [ -n "$ORIGIN" ]; then
            set +e
            az webapp list --resource-group "${RESOURCE_GROUP}" --query '[].{name:name,host:defaultHostName,state:state,kind:kind,region:location}' --output json > scanner-webapps.json
            WEBAPPS_STATUS=$?
            set -e
            if [ "$WEBAPPS_STATUS" = "0" ]; then
              ORIGIN="$ORIGIN" python3 - <<'PY'
          import json, os, urllib.parse
          host = urllib.parse.urlparse(os.environ['ORIGIN']).hostname or ''
          matches = [item for item in json.load(open('scanner-webapps.json')) if str(item.get('host') or '').lower() == host.lower()]
          if len(matches) == 1:
              item = matches[0]
              print(f'SCANNER_RESOURCE_FOUND=YES')
              print(f'SCANNER_RESOURCE_NAME={item.get("name")}')
              print(f'SCANNER_RESOURCE_TYPE={item.get("kind")}')
              print(f'SCANNER_RESOURCE_STATE={item.get("state")}')
              print(f'SCANNER_RESOURCE_REGION={item.get("region")}')
          elif len(matches) == 0:
              print('SCANNER_RESOURCE_FOUND=NO')
          else:
              print('SCANNER_RESOURCE_FOUND=AMBIGUOUS')
          PY
            else
              echo 'SCANNER_RESOURCE_FOUND=UNPROVABLE'
            fi
            READY_CODE="$(curl -sS -m 20 -o ready-body.txt -w '%{http_code}' "${ORIGIN}/health/ready" || echo 000)"
            echo "SCANNER_READY_HTTP_STATUS=${READY_CODE}"
            case "$READY_CODE" in
              200) echo 'SCANNER_READY_RESPONSE_CLASS=READY' ;;
              401|403) echo 'SCANNER_READY_RESPONSE_CLASS=AUTH_REQUIRED' ;;
              000) echo 'SCANNER_READY_RESPONSE_CLASS=NETWORK_OR_TLS_FAILURE' ;;
              *) echo 'SCANNER_READY_RESPONSE_CLASS=NON_READY' ;;
            esac
            # A synthetic byte is used only to prove routing/auth/response shape.
            # No bearer secret is extracted from App Service or Key Vault.
            SCAN_CODE="$(printf x | curl -sS -m 20 -o scan-body.txt -w '%{http_code}' -X POST \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-File-Size: 1' \
              -H 'X-Content-Type: text/plain' \
              --data-binary @- "${ORIGIN}/scan" || echo 000)"
            echo "SCANNER_SCAN_HTTP_STATUS=${SCAN_CODE}"
            case "$SCAN_CODE" in
              401|403) echo 'SCANNER_SCAN_AUTH_RESULT=AUTH_REQUIRED' ;;
              2*) echo 'SCANNER_SCAN_AUTH_RESULT=NOT_REQUIRED_OR_ACCEPTED' ;;
              000) echo 'SCANNER_SCAN_AUTH_RESULT=NETWORK_OR_TLS_FAILURE' ;;
              *) echo 'SCANNER_SCAN_AUTH_RESULT=UNPROVABLE' ;;
            esac
          else
            echo 'SCANNER_RESOURCE_FOUND=NOT_CONFIGURED'
            echo 'SCANNER_READY_HTTP_STATUS=NOT_CONFIGURED'
            echo 'SCANNER_SCAN_HTTP_STATUS=NOT_CONFIGURED'
          fi
          PLAN_ID="$(az webapp show --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --query serverFarmId -o tsv)"
          az appservice plan show --ids "$PLAN_ID" --query '{sku:sku,workerCount:numberOfWorkers,capacity:sku.capacity,reserved:reserved}' --output json
          set +e
          az monitor metrics list --resource "$(az webapp show --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}" --query id -o tsv)" --metric MemoryWorkingSet --interval PT1H --aggregation Maximum --output json
          METRICS_STATUS=$?
          set -e
          echo "MEMORY_METRICS_STATUS=${METRICS_STATUS}"

      - name: Restart and verify the known-good backend
        if: ${{ inputs.backend_recovery_action == 'restart' }}
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}"
          CONSECUTIVE_OK=0
          for i in $(seq 1 12); do
            HEALTH_CODE="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)"
            echo "[$i] recovery /health -> $HEALTH_CODE"
            if [ "$HEALTH_CODE" != "200" ]; then CONSECUTIVE_OK=0; sleep 15; continue; fi
            if ! BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"; then
              CONSECUTIVE_OK=0; sleep 15; continue
            fi
            EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" node -e 'const body = JSON.parse(process.env.BODY); if (body.commitSha !== process.env.EXPECTED_SHA || !body.buildTime) process.exit(1);'
            CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
            echo "[$i] expected backend identity verified ($CONSECUTIVE_OK/3)."
            if [ "$CONSECUTIVE_OK" -ge 3 ]; then
              echo "Restart recovered the expected known-good backend."; exit 0
            fi
            sleep 15
          done
          echo "Restart did not recover the expected backend release identity."; exit 1

  # ---------------------------------------------------------------------------
  # Backend: source ZIP with package.json at ROOT -> Kudu ZipDeploy -> Oryx.
  # Verifies the EXACT deployment record created by THIS run.
  # ---------------------------------------------------------------------------
  backend:
    name: Deploy backend (App Service, Oryx build)
    runs-on: ubuntu-latest
    needs: [resolve, recovery_inspection]
    if: ${{ always() && inputs.deploy_backend && needs.resolve.result == 'success' && (needs.recovery_inspection.result == 'success' || needs.recovery_inspection.result == 'skipped') }}
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.product_sha }}

      - name: Write immutable release identity metadata
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); fs.writeFileSync("Backend/release-identity.json", JSON.stringify({commitSha: process.env.RELEASE_SHA, buildTime: process.env.RELEASE_BUILD_TIME}) + "\n")'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.product_sha }}
          RELEASE_BUILD_TIME: ${{ needs.resolve.outputs.build_time }}

      - name: Package backend source (package.json at archive ROOT)
        run: |
          set -euo pipefail
          rm -f backend-deploy.zip
          # Zip from INSIDE Backend/ so package.json is at the archive root (Oryx contract).
          # No Backend/ wrapper, no node_modules (Linux deps are built server-side by Oryx).
          ( cd Backend && zip -r -q "$GITHUB_WORKSPACE/backend-deploy.zip" \
              package.json package-lock.json tsconfig.json .deployment release-identity.json \
              src prisma templates scripts App_Data )
          # OpenAPI spec files live at repository root and must land at archive root.
          for spec in swagger2.yaml swagger.yaml; do
            if [ -f "$spec" ]; then zip -j -q backend-deploy.zip "$spec"; fi
          done

      - name: Validate backend archive (fail fast)
        run: |
          set -euo pipefail
          unzip -Z1 backend-deploy.zip > ziplist.txt
          echo "--- archive entries (top) ---"; head -n 20 ziplist.txt
          fail() { echo "ARTIFACT INVALID: $1"; exit 1; }
          grep -qxF 'package.json'        ziplist.txt || fail "package.json not at archive root"
          grep -qxF 'package-lock.json'   ziplist.txt || fail "package-lock.json missing"
          grep -qxF 'tsconfig.json'       ziplist.txt || fail "tsconfig.json missing"
          grep -qxF '.deployment'         ziplist.txt || fail ".deployment missing"
          grep -qxF 'release-identity.json' ziplist.txt || fail "release identity missing"
          grep -qxF 'src/index.ts'        ziplist.txt || fail "src/index.ts missing"
          grep -qxF 'prisma/schema.prisma' ziplist.txt || fail "prisma/schema.prisma missing"
          grep -qxF 'App_Data/jobs/triggered/adminiculum-db-migrate/runner.cjs' ziplist.txt || fail "migration WebJob missing"
          grep -q '^Backend/'  ziplist.txt && fail "Backend/ wrapper present (breaks Oryx root)"
          grep -q 'node_modules/' ziplist.txt && fail "node_modules present (Windows/Linux mismatch risk)"
          grep -q '^Frontend/' ziplist.txt && fail "Frontend/ present in backend archive"
          echo "Backend archive OK: package.json at root, webjob present, no wrapper/node_modules/Frontend."

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend via Azure CLI and wait for terminal result
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            # Azure CLI performs the supported synchronous ZipDeploy operation
            # and does not return until the deployment command has a terminal result.
            # A CLI timeout or non-zero result fails this step; no deployment-history
            # lookup or automatic second deployment is permitted.
            az webapp deploy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${BACKEND_APP}" \
              --src-path backend-deploy.zip \
              --type zip \
              --async false \
              --timeout 1200000

      - name: Backend health gate (/health 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 16); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] /health -> $CODE"
            if [ "$CODE" = "200" ]; then echo "Backend healthy."; exit 0; fi
            sleep 15
          done
          echo "Backend did not become healthy — STOP (do not migrate an unhealthy backend)."; exit 1

      - name: Verify backend release identity
        run: |
          set -euo pipefail
          BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Backend release SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (!body.buildTime) {
            throw new Error('Backend release build time is missing.');
          }
          console.log(`Backend release identity verified: ${body.commitSha}`);
          NODE

  # ---------------------------------------------------------------------------
  # Recovery: prove the already-running backend is the resolved release before
  # permitting migration when this run intentionally skips backend deployment.
  # ---------------------------------------------------------------------------
  recovery:
    name: Verify current backend for recovery
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !inputs.deploy_backend && inputs.run_migration }}
    environment: production
    steps:
      - name: Verify current backend health and exact release identity
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v node >/dev/null
          HEALTH_CODE="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)"
          echo "Recovery backend /health -> $HEALTH_CODE"
          [ "$HEALTH_CODE" = "200" ] || { echo "Recovery backend health gate failed."; exit 1; }
          BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Recovery backend SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (typeof body.buildTime !== 'string' || !body.buildTime.trim()) {
            throw new Error('Recovery backend build time is missing.');
          }
          console.log(`Recovery backend release identity verified: ${body.commitSha}`);
          NODE

  # ---------------------------------------------------------------------------
  # Migration: canonical adminiculum-db-migrate WebJob ONLY. Verifies the EXACT
  # run created by THIS trigger (a prior Success must never satisfy this run).
  # ---------------------------------------------------------------------------
  migration:
    name: Run canonical migration WebJob
    runs-on: ubuntu-latest
    needs: [resolve, backend, recovery]
    if: >-
      ${{ always()
          && inputs.run_migration
          && needs.resolve.result == 'success'
          && (
            needs.backend.result == 'success'
            || (
              needs.backend.result == 'skipped'
              && inputs.deploy_backend != true
              && needs.recovery.result == 'success'
            )
          ) }}
    environment: production
    steps:
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Trigger + verify THIS migration WebJob run
        shell: bash
        run: |
          set -euo pipefail
          echo "Migration release SHA: ${{ needs.resolve.outputs.product_sha }}"
          command -v az >/dev/null
          command -v curl >/dev/null
          command -v node >/dev/null

          API="https://${BACKEND_APP}.scm.azurewebsites.net/api/triggeredwebjobs/${MIGRATION_WEBJOB}"
          HISTORY_API="${API}/history"
          TOKEN="$(az account get-access-token --query accessToken -o tsv)"
          BASELINE_ONE="$(mktemp)"
          BASELINE_TWO="$(mktemp)"
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$BASELINE_ONE" "$BASELINE_TWO" "$HEADERS" "$BODY"' EXIT

          # Establish a complete, stable pre-trigger run set and reject any
          # already-active migration before this one-shot trigger.
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$BASELINE_ONE"
          if ! BASELINE_FILE="$BASELINE_ONE" node <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));
          const runs = Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
          if (!Array.isArray(runs)) throw new Error('Migration history response is not a run list.');
          for (const run of runs) {
            const status = String(run.status ?? '').toLowerCase();
            if (['running', 'starting', 'pending', 'in_progress', 'in-progress'].includes(status)) {
              throw new Error('An active migration execution already exists.');
            }
          }
          NODE
          then
            echo "Active migration baseline rejected."; exit 1
          fi
          sleep 3
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$BASELINE_TWO"
          BASELINE_ONE="$BASELINE_ONE" BASELINE_TWO="$BASELINE_TWO" node <<'NODE'
          const fs = require('fs');
          const readIds = (file) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            const runs = Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
            if (!Array.isArray(runs)) throw new Error('Migration history response is not a run list.');
            return new Set(runs.map((run) => String(run.id ?? run.runId ?? '')).filter(Boolean));
          };
          const first = readIds(process.env.BASELINE_ONE);
          const second = readIds(process.env.BASELINE_TWO);
          if (first.size !== second.size || [...first].some((id) => !second.has(id))) {
            throw new Error('Migration history baseline changed before trigger.');
          }
          NODE
          cp "$BASELINE_TWO" "$BASELINE_ONE"
          TRIGGER_START_UTC="$(date -u +%s%3N)"
          echo "Migration trigger boundary recorded (UTC)."

          set +e
          HTTP_CODE="$(curl -sS -m 60 -D "$HEADERS" -o "$BODY" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${TOKEN}" "${API}/run")"
          CURL_STATUS=$?
          set -e
          echo "WebJob trigger HTTP status=${HTTP_CODE:-<none>} curl_status=${CURL_STATUS}"
          LOCATION="$(HEADERS="$HEADERS" BACKEND_APP="$BACKEND_APP" MIGRATION_WEBJOB="$MIGRATION_WEBJOB" node <<'NODE'
          const fs = require('fs');
          const headers = fs.readFileSync(process.env.HEADERS, 'utf8').split(/\r?\n/);
          const line = headers.find((entry) => /^location:/i.test(entry));
          if (!line) process.exit(0);
          const location = line.replace(/^[^:]*:\s*/i, '').trim();
          try {
            const url = new URL(location);
            const expectedHost = `${process.env.BACKEND_APP}.scm.azurewebsites.net`;
            const expectedPrefix = `/api/triggeredwebjobs/${process.env.MIGRATION_WEBJOB}/history/`;
            const id = url.pathname.slice(expectedPrefix.length);
            if (url.protocol !== 'https:' || url.hostname !== expectedHost || !url.pathname.startsWith(expectedPrefix) || !id || id.includes('/')) {
              process.exit(2);
            }
            process.stdout.write(url.toString());
          } catch {
            process.exit(2);
          }
          NODE
          )" || { echo "Unexpected WebJob run Location; refusing to poll it."; exit 1; }
          if [ -z "$LOCATION" ]; then
            if [ "$HTTP_CODE" != "200" ] || [ "$CURL_STATUS" -ne 0 ]; then
              echo "WebJob trigger did not meet the HTTP 200 success contract; refusing history fallback."
              exit 1
            fi
            echo "WebJob trigger returned HTTP 200 without Location; using stable history delta."
            FOUND_RUN=""
            for i in $(seq 1 40); do
              CURRENT_HISTORY="$(mktemp)"
              curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$CURRENT_HISTORY"
              RESULT="$(BASELINE_FILE="$BASELINE_ONE" HISTORY_FILE="$CURRENT_HISTORY" TRIGGER_START_UTC="$TRIGGER_START_UTC" node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));
          const current = JSON.parse(fs.readFileSync(process.env.HISTORY_FILE, 'utf8'));
          const list = (value) => Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
          const baseRuns = list(baseline);
          const currentRuns = list(current);
          const baselineIds = new Set(baseRuns.map((run) => String(run.id ?? run.runId ?? '')).filter(Boolean));
          const boundary = Number(process.env.TRIGGER_START_UTC) - 120000;
          const candidates = currentRuns.filter((run) => {
            const id = String(run.id ?? run.runId ?? '');
            const started = Date.parse(run.start_time ?? run.startTime ?? run.startTimeUtc ?? '') || Number(run.start_time ?? 0);
            return id && !baselineIds.has(id) && Number.isFinite(started) && started >= boundary;
          });
          if (candidates.length > 1) process.exit(3);
          if (candidates.length === 1) process.stdout.write(String(candidates[0].id ?? candidates[0].runId));
          NODE
              )"
              CODE=$?
              rm -f "$CURRENT_HISTORY"
              if [ "$CODE" -eq 3 ]; then echo "Multiple qualifying new migration runs; refusing ambiguity."; exit 1; fi
              if [ "$CODE" -ne 0 ]; then echo "Unable to identify migration history delta."; exit 1; fi
              if [ -n "$RESULT" ]; then FOUND_RUN="$RESULT"; break; fi
              echo "[$i] No unique post-trigger migration run yet."
              sleep 10
            done
            [ -n "$FOUND_RUN" ] || { echo "Timed out identifying a unique new migration run."; exit 1; }
            NEW_RUN="$FOUND_RUN"
            LOCATION="${API}/history/${NEW_RUN}"
          else
            NEW_RUN="${LOCATION##*/}"
          fi
          echo "This run's WebJob execution id: $NEW_RUN"

          # Poll ONLY the run URL returned by THIS trigger; a prior Success
          # in the history list can never satisfy this job.
          for i in $(seq 1 40); do
            ST="$(curl -sS -m 25 -H "Authorization: Bearer ${TOKEN}" "$LOCATION" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);process.stdout.write(String(j.status??'?'))}catch(e){process.stdout.write('?')}})")"
            echo "[$i] WebJob run $NEW_RUN status=$ST"
            if [ "$ST" = "Success" ]; then echo "Migration WebJob run $NEW_RUN succeeded."; exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "Error" ] || [ "$ST" = "Aborted" ]; then
              echo "Migration WebJob run $NEW_RUN did not succeed."; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for WebJob run $NEW_RUN."; exit 1

      - name: Backend health gate after migration (/health 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] /health -> $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Backend unhealthy after migration."; exit 1

  # ---------------------------------------------------------------------------
  # Frontend: Next standalone -> ZIP -> App Service (Oryx OFF). Uses the SAME
  # pinned SHA. Supports frontend-only deploys: when the backend was not
  # deployed this run, it first proves the CURRENT production backend is healthy.
  # Never runs concurrently with the backend job.
  # ---------------------------------------------------------------------------
  frontend:
    name: Deploy frontend (App Service, standalone)
    runs-on: ubuntu-latest
    needs: [resolve, backend, migration]
    # always() so this is evaluated even when backend/migration were intentionally skipped;
    # explicit result checks still block if backend or migration FAILED.
    if: >-
      ${{ always()
          && inputs.deploy_frontend
          && needs.resolve.result == 'success'
          && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
          && (
            (inputs.run_migration && needs.migration.result == 'success')
            || (
              !inputs.run_migration
              && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
            )
          ) }}
    environment: production
    # Public, browser-exposed build configuration. Next.js inlines NEXT_PUBLIC_*
    # at BUILD TIME, so these MUST be present when `next build` runs — a runtime
    # App Service setting cannot repair an already-baked client bundle. Sourced
    # from GitHub Environment (production) VARIABLES (non-secret public IDs/URLs),
    # never from secrets. See Frontend/scripts/production-auth-build-contract.mjs.
    env:
      NEXT_PUBLIC_WORKFORCE_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_CLIENT_ID }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_TENANT_ID: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_TENANT_ID }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_AUTHORITY: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_AUTHORITY }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_REDIRECT_URI }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_POST_LOGOUT_REDIRECT_URI }}
      NEXT_PUBLIC_WORKFORCE_ADMINICULUM_API_SCOPE: ${{ vars.NEXT_PUBLIC_WORKFORCE_ADMINICULUM_API_SCOPE }}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_TENANT_ID }}
      NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.NEXT_PUBLIC_ENTRA_AUTHORITY }}
      NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_ENTRA_REDIRECT_URI }}
      NEXT_PUBLIC_ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_ENTRA_POST_LOGOUT_REDIRECT_URI }}
      NEXT_PUBLIC_ADMINICULUM_API_SCOPE: ${{ vars.NEXT_PUBLIC_ADMINICULUM_API_SCOPE }}
      NEXT_PUBLIC_BACKEND_BASE_URL: ${{ vars.NEXT_PUBLIC_BACKEND_BASE_URL }}
      NEXT_PUBLIC_APP_COMMIT_SHA: ${{ needs.resolve.outputs.product_sha }}
      NEXT_PUBLIC_APP_BUILD_TIME: ${{ needs.resolve.outputs.build_time }}
    steps:
      - name: If backend was not deployed this run, require the current production backend to be healthy
        if: ${{ inputs.deploy_backend != true }}
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] current backend /health -> $CODE"
            if [ "$CODE" = "200" ]; then echo "Current backend healthy — proceeding with frontend-only deploy."; exit 0; fi
            sleep 10
          done
          echo "Current production backend is not healthy — refusing frontend-only deploy."; exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.product_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate production public auth build config (fail closed)
        working-directory: Frontend
        run: |
          set -euo pipefail
          # Fails BEFORE build if any required public NEXT_PUBLIC_* auth variable
          # is empty, so an invalid artifact (empty MSAL clientId/authority) can
          # never be generated. Prints variable NAMES only, never values.
          npm run verify:prod-auth-config

      - name: Production Next build (standalone)
        working-directory: Frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -d .next/standalone || { echo "standalone output missing (next.config output: 'standalone'?)"; exit 1; }

      - name: Assert baked auth config in standalone artifact (regression guard)
        working-directory: Frontend
        run: |
          set -euo pipefail
          # Proves the emitted bundle contains the real workforce + customer
          # clientId/authority/scopes (not the incident's empty state).
          npm run verify:prod-auth-bundle

      - name: Assemble + validate standalone package
        working-directory: Frontend
        run: |
          set -euo pipefail
          SERVER=$(find .next/standalone -name server.js -not -path '*/node_modules/*' | head -1)
          test -n "$SERVER" || { echo "standalone server.js not found"; exit 1; }
          SA_DIR=$(dirname "$SERVER")
          mkdir -p "$SA_DIR/.next"
          cp -r .next/static "$SA_DIR/.next/static"
          if [ -d public ]; then cp -r public "$SA_DIR/public"; fi
          test -d "$SA_DIR/.next/static" || { echo ".next/static not assembled"; exit 1; }
          ( cd "$SA_DIR" && zip -r -q "$GITHUB_WORKSPACE/frontend-deploy.zip" . )
          unzip -Z1 "$GITHUB_WORKSPACE/frontend-deploy.zip" > "$GITHUB_WORKSPACE/felist.txt"
          grep -qxF 'server.js' "$GITHUB_WORKSPACE/felist.txt" || { echo "server.js not at package root"; exit 1; }
          grep -q '^.next/static/' "$GITHUB_WORKSPACE/felist.txt" || { echo ".next/static missing from package"; exit 1; }
          echo "Frontend standalone package OK: server.js at root + .next/static present."

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production frontend standalone contract
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            STARTUP="$(az webapp config show --resource-group "${RESOURCE_GROUP}" --name "${FRONTEND_APP}" --query appCommandLine -o tsv)"
            [ "$STARTUP" = "node server.js" ] || { echo "Unexpected frontend startup command: ${STARTUP:-<empty>}"; exit 1; }
            # Oryx-OFF contract check. Node is not available inside the azure/cli
            # container, so query each setting directly with `az` (jmespath) — same
            # semantics, no Node dependency.
            for NAME in SCM_DO_BUILD_DURING_DEPLOYMENT ENABLE_ORYX_BUILD; do
              VAL="$(az webapp config appsettings list --resource-group "${RESOURCE_GROUP}" --name "${FRONTEND_APP}" --query "[?name=='${NAME}'].value | [0]" -o tsv)"
              [ "$VAL" = "false" ] || { echo "${NAME} must be false for the standalone package (got: ${VAL:-<empty>})"; exit 1; }
            done
            echo "Frontend production contract verified: Oryx OFF, startup node server.js."

      - name: Deploy frontend (zip, Oryx OFF — app already runs `node server.js`)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp deploy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${FRONTEND_APP}" \
              --src-path frontend-deploy.zip \
              --type zip

      - name: Frontend smoke (unauthenticated)
        run: |
          set -euo pipefail
          ok=1
          for path in / /portal; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://${FRONTEND_APP}.azurewebsites.net${path}" || echo 000)
            echo "GET ${path} -> $CODE"
            [ "$CODE" = "200" ] || ok=0
          done
          [ "$ok" = "1" ] || { echo "Frontend smoke failed."; exit 1; }
          echo "Frontend smoke OK (/ and /portal 200)."

      - name: Verify frontend release identity
        run: |
          set -euo pipefail
          BODY="$(curl -fsS -m 20 "https://${FRONTEND_APP}.azurewebsites.net/api/release-identity")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Frontend release SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (!body.buildTime) {
            throw new Error('Frontend release build time is missing.');
          }
          console.log(`Frontend release identity verified: ${body.commitSha}`);
          NODE
