              echo 'READY_DNS_RESOLUTION=UNPROVABLE'
              echo 'READY_CONNECTIVITY=UNPROVABLE'
              echo 'READY_HTTP_STATUS=UNPROVABLE'
              echo 'READY_STATUS=UNPROVABLE'
            else
              set +e
              getent ahosts "$SCANNER_HOST" >/dev/null 2>&1
              DNS_STATUS=$?
              READY_CODE="$(curl -sS --connect-timeout 10 -m 20 -o ready-body.txt -w '%{http_code}' "https://${SCANNER_HOST}/health/ready")"
              CURL_STATUS=$?
              set -e
              echo "READY_DNS_RESOLUTION=$([ "$DNS_STATUS" = "0" ] && echo PASS || echo FAIL)"
              echo "READY_CONNECTIVITY=$([ "$CURL_STATUS" = "0" ] && echo PASS || echo FAIL)"
              echo "READY_HTTP_STATUS=${READY_CODE}"
              if [ "$READY_CODE" = '200' ]; then
                echo 'READY_STATUS=PASS'
              else
                echo 'READY_STATUS=FAIL'
              fi
            fi
          fi
          echo 'SCAN_STATUS=NOT_PROBED_SAFE_AUTH_UNAVAILABLE'
          echo 'AUTH_WORKS=UNPROVABLE'

      - name: Restart and verify the known-good backend
        if: ${{ inputs.backend_recovery_action == 'restart' }}
        shell: bash
        run: |
          set -euo pipefail
          az webapp restart --resource-group "${RESOURCE_GROUP}" --name "${BACKEND_APP}"
          CONSECUTIVE_OK=0
          for i in $(seq 1 12); do
            HEALTH_CODE="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)"
            echo "[$i] recovery /health -> $HEALTH_CODE"
            if [ "$HEALTH_CODE" != "200" ]; then CONSECUTIVE_OK=0; sleep 15; continue; fi
            if ! BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"; then
              CONSECUTIVE_OK=0; sleep 15; continue
            fi
            EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" node -e 'const body = JSON.parse(process.env.BODY); if (body.commitSha !== process.env.EXPECTED_SHA || !body.buildTime) process.exit(1);'
            CONSECUTIVE_OK=$((CONSECUTIVE_OK + 1))
            echo "[$i] expected backend identity verified ($CONSECUTIVE_OK/3)."
            if [ "$CONSECUTIVE_OK" -ge 3 ]; then
              echo "Restart recovered the expected known-good backend."; exit 0
            fi
            sleep 15
          done
          echo "Restart did not recover the expected backend release identity."; exit 1

  # ---------------------------------------------------------------------------
  # Backend: prebuilt runtime artifact (built on Ubuntu / Node 20) -> Kudu ZipDeploy.
  # Prebuilds dist, generates Prisma client, and packages Linux-compatible runtime node_modules.
  # SCM_DO_BUILD_DURING_DEPLOYMENT is set to false so production Kudu/Oryx does not rebuild.
  # ---------------------------------------------------------------------------
  backend:
    name: Deploy backend (App Service, prebuilt artifact)
    runs-on: ubuntu-latest
    needs: [resolve, recovery_inspection]
    if: ${{ always() && inputs.deploy_backend && needs.resolve.result == 'success' && (needs.recovery_inspection.result == 'success' || needs.recovery_inspection.result == 'skipped') }}
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.product_sha }}

      - name: Setup Node.js 20 for backend prebuild
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Write immutable release identity metadata
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); fs.writeFileSync("Backend/release-identity.json", JSON.stringify({commitSha: process.env.RELEASE_SHA, buildTime: process.env.RELEASE_BUILD_TIME}) + "\n")'
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.product_sha }}
          RELEASE_BUILD_TIME: ${{ needs.resolve.outputs.build_time }}

      - name: Install backend dependencies (Linux x64)
        working-directory: Backend
        run: |
          set -euo pipefail
          npm ci

      - name: Generate Prisma client
        working-directory: Backend
        run: |
          set -euo pipefail
          npx prisma generate

      - name: Build backend TypeScript
        working-directory: Backend
        run: |
          set -euo pipefail
          npx tsc

      - name: Configure .deployment for zero server-side build
        working-directory: Backend
        run: |
          set -euo pipefail
          printf "[config]\nSCM_DO_BUILD_DURING_DEPLOYMENT = false\n" > .deployment

      - name: Package prebuilt backend runtime artifact
        run: |
          set -euo pipefail
          rm -f backend-deploy.zip
          # Zip from INSIDE Backend/ so package.json and dist are at the archive root.
          # Prebuilt artifact contains compiled dist/, complete Linux node_modules/,
          # prisma schema/migrations, templates, scripts, WebJob, and OpenAPI specs.
          ( cd Backend && zip -r -q "$GITHUB_WORKSPACE/backend-deploy.zip" \
              package.json package-lock.json tsconfig.json .deployment release-identity.json \
              dist node_modules prisma templates scripts App_Data )
          for spec in swagger2.yaml swagger.yaml; do
            if [ -f "$spec" ]; then zip -j -q backend-deploy.zip "$spec"; fi
          done

      - name: Validate prebuilt backend artifact (fail fast)
        run: |
          set -euo pipefail
          unzip -Z1 backend-deploy.zip > ziplist.txt
          echo "--- prebuilt archive entries (top) ---"; head -n 25 ziplist.txt
          fail() { echo "ARTIFACT INVALID: $1"; exit 1; }
          grep -qxF 'package.json'        ziplist.txt || fail "package.json not at archive root"
          grep -qxF 'package-lock.json'   ziplist.txt || fail "package-lock.json missing"
          grep -qxF 'tsconfig.json'       ziplist.txt || fail "tsconfig.json missing"
          grep -qxF '.deployment'         ziplist.txt || fail ".deployment missing"
          grep -qxF 'release-identity.json' ziplist.txt || fail "release identity missing"
          grep -qxF 'dist/index.js'       ziplist.txt || fail "compiled dist/index.js missing"
          grep -qxF 'prisma/schema.prisma' ziplist.txt || fail "prisma/schema.prisma missing"
          grep -qxF 'App_Data/jobs/triggered/adminiculum-db-migrate/runner.cjs' ziplist.txt || fail "migration WebJob missing"
          grep -q '^node_modules/express/' ziplist.txt || fail "runtime node_modules/express missing"
          grep -q '^node_modules/@prisma/client/' ziplist.txt || fail "generated @prisma/client missing"
          grep -q '^node_modules/\.prisma/client/' ziplist.txt || fail "generated .prisma/client engine missing"
          grep -q '^node_modules/bcrypt/' ziplist.txt || fail "runtime bcrypt module missing"
          grep -q '^templates/'           ziplist.txt || fail "templates missing"
          grep -q '^swagger'              ziplist.txt || fail "OpenAPI/swagger specs missing"
          grep -q '^Backend/'  ziplist.txt && fail "Backend/ wrapper present (breaks root)"
          grep -q '^Frontend/' ziplist.txt && fail "Frontend/ present in backend archive"
          echo "Prebuilt backend artifact OK: dist/index.js, node_modules (express, prisma, bcrypt), WebJob, templates, and specs verified."

      - name: Assert prebuilt artifact module loading (offline sanity)
        run: |
          set -euo pipefail
          TMP_DIR=$(mktemp -d)
          unzip -q backend-deploy.zip -d "$TMP_DIR"
          grep -qxF 'SCM_DO_BUILD_DURING_DEPLOYMENT = false' "$TMP_DIR/.deployment" || {
            echo "ERROR: .deployment missing SCM_DO_BUILD_DURING_DEPLOYMENT = false"
            exit 1
          }
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(process.argv[1] + "/node_modules/.prisma/client");
            const engines = files.filter(f => f.includes("libquery_engine"));
            console.log("Prisma engines in artifact:", engines);
            if (!engines.some(e => e.includes("debian-openssl") || e.includes("rhel-openssl") || e.includes("linux"))) {
              throw new Error("Linux Prisma engine missing from prebuilt artifact");
            }
          ' "$TMP_DIR"
          ( cd "$TMP_DIR" && node -e "require('express'); console.log('express loaded');" )
          ( cd "$TMP_DIR" && node -e "require('bcrypt'); console.log('bcrypt loaded');" )
          ( cd "$TMP_DIR" && node -e "require('@prisma/client'); console.log('prisma client loaded');" )
          ( cd "$TMP_DIR" && node -e "require('./dist/releaseIdentity.js'); console.log('releaseIdentity loaded');" )
          rm -rf "$TMP_DIR"
          echo "Offline module loading checks PASS."

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend via Azure CLI and wait for terminal result
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            # Azure CLI performs the supported synchronous ZipDeploy operation
            # and does not return until the deployment command has a terminal result.
            # A CLI timeout or non-zero result fails this step; no deployment-history
            # lookup or automatic second deployment is permitted.
            az webapp deploy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${BACKEND_APP}" \
              --src-path backend-deploy.zip \
              --type zip \
              --async false \
              --timeout 1200000

      - name: Backend health gate (/health 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 16); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] /health -> $CODE"
            if [ "$CODE" = "200" ]; then echo "Backend healthy."; exit 0; fi
            sleep 15
          done
          echo "Backend did not become healthy — STOP (do not migrate an unhealthy backend)."; exit 1

      - name: Verify backend release identity
        run: |
          set -euo pipefail
          BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Backend release SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (!body.buildTime) {
            throw new Error('Backend release build time is missing.');
          }
          console.log(`Backend release identity verified: ${body.commitSha}`);
          NODE

  # ---------------------------------------------------------------------------
  # Recovery: prove the already-running backend is the resolved release before
  # permitting migration when this run intentionally skips backend deployment.
  # ---------------------------------------------------------------------------
  recovery:
    name: Verify current backend for recovery
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ !inputs.deploy_backend && inputs.run_migration }}
    environment: production
    steps:
      - name: Verify current backend health and exact release identity
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v node >/dev/null
          HEALTH_CODE="$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)"
          echo "Recovery backend /health -> $HEALTH_CODE"
          [ "$HEALTH_CODE" = "200" ] || { echo "Recovery backend health gate failed."; exit 1; }
          BODY="$(curl -fsS -m 15 "https://${BACKEND_APP}.azurewebsites.net/health/version")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Recovery backend SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (typeof body.buildTime !== 'string' || !body.buildTime.trim()) {
            throw new Error('Recovery backend build time is missing.');
          }
          console.log(`Recovery backend release identity verified: ${body.commitSha}`);
          NODE

  # ---------------------------------------------------------------------------
  # Migration: canonical adminiculum-db-migrate WebJob ONLY. Verifies the EXACT
  # run created by THIS trigger (a prior Success must never satisfy this run).
  # ---------------------------------------------------------------------------
  migration:
    name: Run canonical migration WebJob
    runs-on: ubuntu-latest
    needs: [resolve, backend, recovery]
    if: >-
      ${{ always()
          && inputs.run_migration
          && needs.resolve.result == 'success'
          && (
            needs.backend.result == 'success'
            || (
              needs.backend.result == 'skipped'
              && inputs.deploy_backend != true
              && needs.recovery.result == 'success'
            )
          ) }}
    environment: production
    steps:
      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Trigger + verify THIS migration WebJob run
        shell: bash
        run: |
          set -euo pipefail
          echo "Migration release SHA: ${{ needs.resolve.outputs.product_sha }}"
          command -v az >/dev/null
          command -v curl >/dev/null
          command -v node >/dev/null

          API="https://${BACKEND_APP}.scm.azurewebsites.net/api/triggeredwebjobs/${MIGRATION_WEBJOB}"
          HISTORY_API="${API}/history"
          TOKEN="$(az account get-access-token --query accessToken -o tsv)"
          BASELINE_ONE="$(mktemp)"
          BASELINE_TWO="$(mktemp)"
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$BASELINE_ONE" "$BASELINE_TWO" "$HEADERS" "$BODY"' EXIT

          # Establish a complete, stable pre-trigger run set and reject any
          # already-active migration before this one-shot trigger.
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$BASELINE_ONE"
          if ! BASELINE_FILE="$BASELINE_ONE" node <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));
          const runs = Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
          if (!Array.isArray(runs)) throw new Error('Migration history response is not a run list.');
          for (const run of runs) {
            const status = String(run.status ?? '').toLowerCase();
            if (['running', 'starting', 'pending', 'in_progress', 'in-progress'].includes(status)) {
              throw new Error('An active migration execution already exists.');
            }
          }
          NODE
          then
            echo "Active migration baseline rejected."; exit 1
          fi
          sleep 3
          curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$BASELINE_TWO"
          BASELINE_ONE="$BASELINE_ONE" BASELINE_TWO="$BASELINE_TWO" node <<'NODE'
          const fs = require('fs');
          const readIds = (file) => {
            const value = JSON.parse(fs.readFileSync(file, 'utf8'));
            const runs = Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
            if (!Array.isArray(runs)) throw new Error('Migration history response is not a run list.');
            return new Set(runs.map((run) => String(run.id ?? run.runId ?? '')).filter(Boolean));
          };
          const first = readIds(process.env.BASELINE_ONE);
          const second = readIds(process.env.BASELINE_TWO);
          if (first.size !== second.size || [...first].some((id) => !second.has(id))) {
            throw new Error('Migration history baseline changed before trigger.');
          }
          NODE
          cp "$BASELINE_TWO" "$BASELINE_ONE"
          TRIGGER_START_UTC="$(date -u +%s%3N)"
          echo "Migration trigger boundary recorded (UTC)."

          set +e
          HTTP_CODE="$(curl -sS -m 60 -D "$HEADERS" -o "$BODY" -w '%{http_code}' \
            -X POST -H "Authorization: Bearer ${TOKEN}" "${API}/run")"
          CURL_STATUS=$?
          set -e
          echo "WebJob trigger HTTP status=${HTTP_CODE:-<none>} curl_status=${CURL_STATUS}"
          LOCATION="$(HEADERS="$HEADERS" BACKEND_APP="$BACKEND_APP" MIGRATION_WEBJOB="$MIGRATION_WEBJOB" node <<'NODE'
          const fs = require('fs');
          const headers = fs.readFileSync(process.env.HEADERS, 'utf8').split(/\r?\n/);
          const line = headers.find((entry) => /^location:/i.test(entry));
          if (!line) process.exit(0);
          const location = line.replace(/^[^:]*:\s*/i, '').trim();
          try {
            const url = new URL(location);
            const expectedHost = `${process.env.BACKEND_APP}.scm.azurewebsites.net`;
            const expectedPrefix = `/api/triggeredwebjobs/${process.env.MIGRATION_WEBJOB}/history/`;
            const id = url.pathname.slice(expectedPrefix.length);
            if (url.protocol !== 'https:' || url.hostname !== expectedHost || !url.pathname.startsWith(expectedPrefix) || !id || id.includes('/')) {
              process.exit(2);
            }
            process.stdout.write(url.toString());
          } catch {
            process.exit(2);
          }
          NODE
          )" || { echo "Unexpected WebJob run Location; refusing to poll it."; exit 1; }
          if [ -z "$LOCATION" ]; then
            if [ "$HTTP_CODE" != "200" ] || [ "$CURL_STATUS" -ne 0 ]; then
              echo "WebJob trigger did not meet the HTTP 200 success contract; refusing history fallback."
              exit 1
            fi
            echo "WebJob trigger returned HTTP 200 without Location; using stable history delta."
            FOUND_RUN=""
            for i in $(seq 1 40); do
              CURRENT_HISTORY="$(mktemp)"
              curl -fsS -m 30 -H "Authorization: Bearer ${TOKEN}" "$HISTORY_API" -o "$CURRENT_HISTORY"
              RESULT="$(BASELINE_FILE="$BASELINE_ONE" HISTORY_FILE="$CURRENT_HISTORY" TRIGGER_START_UTC="$TRIGGER_START_UTC" node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync(process.env.BASELINE_FILE, 'utf8'));
          const current = JSON.parse(fs.readFileSync(process.env.HISTORY_FILE, 'utf8'));
          const list = (value) => Array.isArray(value) ? value : (value.runs ?? value.value ?? []);
          const baseRuns = list(baseline);
          const currentRuns = list(current);
          const baselineIds = new Set(baseRuns.map((run) => String(run.id ?? run.runId ?? '')).filter(Boolean));
          const boundary = Number(process.env.TRIGGER_START_UTC) - 120000;
          const candidates = currentRuns.filter((run) => {
            const id = String(run.id ?? run.runId ?? '');
            const started = Date.parse(run.start_time ?? run.startTime ?? run.startTimeUtc ?? '') || Number(run.start_time ?? 0);
            return id && !baselineIds.has(id) && Number.isFinite(started) && started >= boundary;
          });
          if (candidates.length > 1) process.exit(3);
          if (candidates.length === 1) process.stdout.write(String(candidates[0].id ?? candidates[0].runId));
          NODE
              )"
              CODE=$?
              rm -f "$CURRENT_HISTORY"
              if [ "$CODE" -eq 3 ]; then echo "Multiple qualifying new migration runs; refusing ambiguity."; exit 1; fi
              if [ "$CODE" -ne 0 ]; then echo "Unable to identify migration history delta."; exit 1; fi
              if [ -n "$RESULT" ]; then FOUND_RUN="$RESULT"; break; fi
              echo "[$i] No unique post-trigger migration run yet."
              sleep 10
            done
            [ -n "$FOUND_RUN" ] || { echo "Timed out identifying a unique new migration run."; exit 1; }
            NEW_RUN="$FOUND_RUN"
            LOCATION="${API}/history/${NEW_RUN}"
          else
            NEW_RUN="${LOCATION##*/}"
          fi
          echo "This run's WebJob execution id: $NEW_RUN"

          # Poll ONLY the run URL returned by THIS trigger; a prior Success
          # in the history list can never satisfy this job.
          for i in $(seq 1 40); do
            ST="$(curl -sS -m 25 -H "Authorization: Bearer ${TOKEN}" "$LOCATION" \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const j=JSON.parse(d);process.stdout.write(String(j.status??'?'))}catch(e){process.stdout.write('?')}})")"
            echo "[$i] WebJob run $NEW_RUN status=$ST"
            if [ "$ST" = "Success" ]; then echo "Migration WebJob run $NEW_RUN succeeded."; exit 0; fi
            if [ "$ST" = "Failed" ] || [ "$ST" = "Error" ] || [ "$ST" = "Aborted" ]; then
              echo "Migration WebJob run $NEW_RUN did not succeed."; exit 1; fi
            sleep 10
          done
          echo "Timed out waiting for WebJob run $NEW_RUN."; exit 1

      - name: Backend health gate after migration (/health 200)
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] /health -> $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "Backend unhealthy after migration."; exit 1

  # ---------------------------------------------------------------------------
  # Frontend: Next standalone -> ZIP -> App Service (Oryx OFF). Uses the SAME
  # pinned SHA. Supports frontend-only deploys: when the backend was not
  # deployed this run, it first proves the CURRENT production backend is healthy.
  # Never runs concurrently with the backend job.
  # ---------------------------------------------------------------------------
  frontend:
    name: Deploy frontend (App Service, standalone)
    runs-on: ubuntu-latest
    needs: [resolve, backend, migration]
    # always() so this is evaluated even when backend/migration were intentionally skipped;
    # explicit result checks still block if backend or migration FAILED.
    if: >-
      ${{ always()
          && inputs.deploy_frontend
          && needs.resolve.result == 'success'
          && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
          && (
            (inputs.run_migration && needs.migration.result == 'success')
            || (
              !inputs.run_migration
              && (needs.migration.result == 'success' || needs.migration.result == 'skipped')
            )
          ) }}
    environment: production
    # Public, browser-exposed build configuration. Next.js inlines NEXT_PUBLIC_*
    # at BUILD TIME, so these MUST be present when `next build` runs — a runtime
    # App Service setting cannot repair an already-baked client bundle. Sourced
    # from GitHub Environment (production) VARIABLES (non-secret public IDs/URLs),
    # never from secrets. See Frontend/scripts/production-auth-build-contract.mjs.
    env:
      NEXT_PUBLIC_WORKFORCE_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_CLIENT_ID }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_TENANT_ID: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_TENANT_ID }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_AUTHORITY: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_AUTHORITY }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_REDIRECT_URI }}
      NEXT_PUBLIC_WORKFORCE_ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_WORKFORCE_ENTRA_POST_LOGOUT_REDIRECT_URI }}
      NEXT_PUBLIC_WORKFORCE_ADMINICULUM_API_SCOPE: ${{ vars.NEXT_PUBLIC_WORKFORCE_ADMINICULUM_API_SCOPE }}
      NEXT_PUBLIC_ENTRA_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
      NEXT_PUBLIC_ENTRA_TENANT_ID: ${{ vars.NEXT_PUBLIC_ENTRA_TENANT_ID }}
      NEXT_PUBLIC_ENTRA_AUTHORITY: ${{ vars.NEXT_PUBLIC_ENTRA_AUTHORITY }}
      NEXT_PUBLIC_ENTRA_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_ENTRA_REDIRECT_URI }}
      NEXT_PUBLIC_ENTRA_POST_LOGOUT_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_ENTRA_POST_LOGOUT_REDIRECT_URI }}
      NEXT_PUBLIC_ADMINICULUM_API_SCOPE: ${{ vars.NEXT_PUBLIC_ADMINICULUM_API_SCOPE }}
      NEXT_PUBLIC_BACKEND_BASE_URL: ${{ vars.NEXT_PUBLIC_BACKEND_BASE_URL }}
      NEXT_PUBLIC_APP_COMMIT_SHA: ${{ needs.resolve.outputs.product_sha }}
      NEXT_PUBLIC_APP_BUILD_TIME: ${{ needs.resolve.outputs.build_time }}
    steps:
      - name: If backend was not deployed this run, require the current production backend to be healthy
        if: ${{ inputs.deploy_backend != true }}
        run: |
          set -euo pipefail
          for i in $(seq 1 8); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "https://${BACKEND_APP}.azurewebsites.net/health" || echo 000)
            echo "[$i] current backend /health -> $CODE"
            if [ "$CODE" = "200" ]; then echo "Current backend healthy — proceeding with frontend-only deploy."; exit 0; fi
            sleep 10
          done
          echo "Current production backend is not healthy — refusing frontend-only deploy."; exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.product_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate production public auth build config (fail closed)
        working-directory: Frontend
        run: |
          set -euo pipefail
          # Fails BEFORE build if any required public NEXT_PUBLIC_* auth variable
          # is empty, so an invalid artifact (empty MSAL clientId/authority) can
          # never be generated. Prints variable NAMES only, never values.
          npm run verify:prod-auth-config

      - name: Production Next build (standalone)
        working-directory: Frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -d .next/standalone || { echo "standalone output missing (next.config output: 'standalone'?)"; exit 1; }

      - name: Assert baked auth config in standalone artifact (regression guard)
        working-directory: Frontend
        run: |
          set -euo pipefail
          # Proves the emitted bundle contains the real workforce + customer
          # clientId/authority/scopes (not the incident's empty state).
          npm run verify:prod-auth-bundle

      - name: Assemble + validate standalone package
        working-directory: Frontend
        run: |
          set -euo pipefail
          SERVER=$(find .next/standalone -name server.js -not -path '*/node_modules/*' | head -1)
          test -n "$SERVER" || { echo "standalone server.js not found"; exit 1; }
          SA_DIR=$(dirname "$SERVER")
          mkdir -p "$SA_DIR/.next"
          cp -r .next/static "$SA_DIR/.next/static"
          if [ -d public ]; then cp -r public "$SA_DIR/public"; fi
          test -d "$SA_DIR/.next/static" || { echo ".next/static not assembled"; exit 1; }
          ( cd "$SA_DIR" && zip -r -q "$GITHUB_WORKSPACE/frontend-deploy.zip" . )
          unzip -Z1 "$GITHUB_WORKSPACE/frontend-deploy.zip" > "$GITHUB_WORKSPACE/felist.txt"
          grep -qxF 'server.js' "$GITHUB_WORKSPACE/felist.txt" || { echo "server.js not at package root"; exit 1; }
          grep -q '^.next/static/' "$GITHUB_WORKSPACE/felist.txt" || { echo ".next/static missing from package"; exit 1; }
          echo "Frontend standalone package OK: server.js at root + .next/static present."

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify production frontend standalone contract
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            STARTUP="$(az webapp config show --resource-group "${RESOURCE_GROUP}" --name "${FRONTEND_APP}" --query appCommandLine -o tsv)"
            [ "$STARTUP" = "node server.js" ] || { echo "Unexpected frontend startup command: ${STARTUP:-<empty>}"; exit 1; }
            # Oryx-OFF contract check. Node is not available inside the azure/cli
            # container, so query each setting directly with `az` (jmespath) — same
            # semantics, no Node dependency.
            for NAME in SCM_DO_BUILD_DURING_DEPLOYMENT ENABLE_ORYX_BUILD; do
              VAL="$(az webapp config appsettings list --resource-group "${RESOURCE_GROUP}" --name "${FRONTEND_APP}" --query "[?name=='${NAME}'].value | [0]" -o tsv)"
              [ "$VAL" = "false" ] || { echo "${NAME} must be false for the standalone package (got: ${VAL:-<empty>})"; exit 1; }
            done
            echo "Frontend production contract verified: Oryx OFF, startup node server.js."

      - name: Deploy frontend (zip, Oryx OFF — app already runs `node server.js`)
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail
            az webapp deploy \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${FRONTEND_APP}" \
              --src-path frontend-deploy.zip \
              --type zip

      - name: Frontend smoke (unauthenticated)
        run: |
          set -euo pipefail
          ok=1
          for path in / /portal; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 20 "https://${FRONTEND_APP}.azurewebsites.net${path}" || echo 000)
            echo "GET ${path} -> $CODE"
            [ "$CODE" = "200" ] || ok=0
          done
          [ "$ok" = "1" ] || { echo "Frontend smoke failed."; exit 1; }
          echo "Frontend smoke OK (/ and /portal 200)."

      - name: Verify frontend release identity
        run: |
          set -euo pipefail
          BODY="$(curl -fsS -m 20 "https://${FRONTEND_APP}.azurewebsites.net/api/release-identity")"
          EXPECTED_SHA="${{ needs.resolve.outputs.product_sha }}" BODY="$BODY" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const body = JSON.parse(process.env.BODY);
          const expected = process.env.EXPECTED_SHA;
          if (body.commitSha !== expected) {
            throw new Error(`Frontend release SHA mismatch: expected ${expected}, got ${body.commitSha ?? '<null>'}`);
          }
          if (!body.buildTime) {
            throw new Error('Frontend release build time is missing.');
          }
          console.log(`Frontend release identity verified: ${body.commitSha}`);
          NODE
