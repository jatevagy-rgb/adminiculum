name: Preflight Quality Gate

on:
  pull_request:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'
              - '.github/**'
            frontend:
              - 'Frontend/**'
              - '.github/**'

  backend-preflight:
    name: Backend preflight
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/adminiculum_ci?schema=public
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_at_least_32_chars
      AZURE_AD_TENANT_ID: 00000000-0000-0000-0000-000000000000
      AZURE_AD_AUDIENCE: api://00000000-0000-0000-0000-000000000000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SP_TENANT_ID: 00000000-0000-0000-0000-000000000000
      SP_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      SP_CLIENT_SECRET: dummy-ci-sharepoint-client-secret
      SP_SITE_ID: dummy-site-id
      SP_DRIVE_ID: dummy-drive-id
      SHAREPOINT_SITE_URL: https://example.sharepoint.com/sites/adminiculum-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  backend-tests:
    name: Backend non-PG tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_at_least_32_chars
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Non-PG tests
        run: npx jest --runInBand

  frontend-preflight:
    name: Frontend preflight
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      NODE_ENV: test
      NEXT_PUBLIC_BACKEND_BASE_URL: http://localhost:3001
      NEXT_PUBLIC_ENTRA_TENANT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_ENTRA_CLIENT_ID: 00000000-0000-0000-0000-000000000000
      NEXT_PUBLIC_ADMINICULUM_API_SCOPE: api://00000000-0000-0000-0000-000000000000/access_as_user
      NEXT_PUBLIC_ENABLE_LOCAL_DEV_AUTH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (generates Next .next/types)
        run: npm run build

      - name: Typecheck (run after build for .next/types)
        run: npx tsc --noEmit

      - name: Behavioural tests
        run: npm test