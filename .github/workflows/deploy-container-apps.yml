name: Deploy to Azure Container Apps (Bicep)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip Prisma migration step'
        required: false
        default: false
        type: boolean

env:
  BACKEND_IMAGE: 'ghcr.io/${{ github.repository }}/adminiculum-backend:${{ github.sha }}'
  FRONTEND_IMAGE: 'ghcr.io/${{ github.repository }}/adminiculum-frontend:${{ github.sha }}'
  AZURE_CONTAINERAPPS_ENVIRONMENT: 'northeurope'
  RESOURCE_GROUP: '${{ github.repository_owner }}-adminiculum-rg'
  REGISTRY_SERVER: 'ghcr.io'
  REGISTRY_USERNAME: '${{ github.repository_owner }}'

jobs:
  build-images:
    name: Build Container Images
    runs-on: ubuntu-latest
    outputs:
      backend_image_tag: ${{ env.BACKEND_IMAGE }}
      frontend_image_tag: ${{ env.FRONTEND_IMAGE }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: Backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: Frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  deploy-infra:
    name: Deploy Infrastructure (Bicep)
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Bicep
        uses: azure/arm-deploy@v2
        id: deploy
        with:
          scope: resourceGroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: Infrastructure/bicep/main.bicep
          parameters: |
            baseName=adminiculum
            location=northeurope
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            backendImage=${{ needs.build-images.outputs.backend_image_tag }}
            allowedOrigins=https://${{ vars.FRONTEND_FQDN || 'adminiculum.example.com' }}
            frontendUrl=https://${{ vars.FRONTEND_FQDN || 'adminiculum.example.com' }}
            registryServer=${{ env.REGISTRY_SERVER }}
            registryUsername=${{ env.REGISTRY_USERNAME }}
            azureAdTenantId=${{ vars.AZURE_AD_TENANT_ID || '' }}
            azureAdAudience=${{ vars.AZURE_AD_AUDIENCE || '' }}

      - name: Upload deployment outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-outputs
          path: ${{ steps.deploy.outputs.deploymentOutputs }}

  run-migration:
    name: Run Prisma Migration (Container Apps Job)
    runs-on: ubuntu-latest
    needs: [build-images, deploy-infra]
    if: ${{ inputs.skip_migration != true }}

    steps:
      - uses: actions/checkout@v4

      - name: Download deployment outputs
        uses: actions/download-artifact@v4
        with:
          name: deployment-outputs
          path: .

      - name: Azure CLI login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run migration job
        run: |
          JOB_NAME=$(jq -r '.migrationJobName.value' deployment-outputs.json)
          echo "Starting migration job: $JOB_NAME"
          az containerapp job start \
            --name "$JOB_NAME" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --container-name migration

      - name: Poll migration job status
        run: |
          JOB_NAME=$(jq -r '.migrationJobName.value' deployment-outputs.json)
          echo "Waiting for migration job to complete..."
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution list \
              --name "$JOB_NAME" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query '[0].status' -o tsv 2>/dev/null || echo "Waiting")
            echo "[$i] Job status: $STATUS"
            if [ "$STATUS" == "Succeeded" ]; then
              echo "Migration job completed successfully."
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "Migration job FAILED."
              az containerapp job execution list \
                --name "$JOB_NAME" \
                --resource-group "${{ env.RESOURCE_GROUP }}" \
                --query '[0].logs' -o tsv
              exit 1
            fi
            sleep 10
          done
          echo "Migration job timed out after 5 minutes."
          exit 1

  restart-backend:
    name: Restart Backend Container App
    runs-on: ubuntu-latest
    needs: [deploy-infra, run-migration]
    if: ${{ always() && needs.deploy-infra.result == 'success' && needs.run-migration.result != 'failed' }}

    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Restart backend container app
        run: |
          az containerapp revision restart \
            --name adminiculum-backend \
            --resource-group "${{ env.RESOURCE_GROUP }}"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-infra, restart-backend]
    if: ${{ vars.RUN_SMOKE == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke suite
        run: node scripts/smoke.js
