name: Verify Production Schema (read-only, generic)

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: "Prisma migration directory name (e.g. 20260906000000_organization_person_contact_fields)"
        required: true
        type: string
      table_name:
        description: "Optional public-schema table name to prove (empty skips table/column checks)"
        required: false
        type: string
        default: ""
      columns_json:
        description: 'Optional JSON array of column names to prove (e.g. ["email","phone"])'
        required: false
        type: string
        default: "[]"
      extra_migration_names_json:
        description: 'Optional JSON array of additional migration names to probe (e.g. ["20260906100000_x"])'
        required: false
        type: string
        default: "[]"

permissions:
  contents: read
  id-token: write

jobs:
  verify-production-schema-readonly:
    name: Read-only production schema metadata proof
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install database client dependency
        working-directory: Backend
        run: npm ci --ignore-scripts

      # Inputs are data only: they reach the script exclusively through the
      # process environment (env: above), never through shell interpolation.
      # The script validates every identifier before opening any connection.
      - name: Execute read-only production schema metadata proof
        working-directory: Backend
        shell: bash
        env:
          SCHEMA_PROOF_MIGRATION_NAME: ${{ inputs.migration_name }}
          SCHEMA_PROOF_TABLE_NAME: ${{ inputs.table_name }}
          SCHEMA_PROOF_COLUMNS_JSON: ${{ inputs.columns_json }}
          SCHEMA_PROOF_EXTRA_MIGRATIONS_JSON: ${{ inputs.extra_migration_names_json }}
        run: |
          set -euo pipefail
          set +x
          export AZURE_CORE_OUTPUT=none
          DATABASE_URL="$(az webapp config appsettings list \
            --resource-group Adminiculum \
            --name adminiculumbackend-b1-01 \
            --query "[?name=='DATABASE_URL'].value | [0]" \
            --output tsv)"
          test -n "${DATABASE_URL:-}" || { echo "DATABASE_URL is required." >&2; exit 1; }
          echo "::add-mask::${DATABASE_URL}"
          export DATABASE_URL
          proof_status=0
          node scripts/verify-production-schema-readonly.mjs || proof_status=$?
          unset DATABASE_URL
          exit "${proof_status}"
