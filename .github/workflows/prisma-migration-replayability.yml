name: Prisma migration replayability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Backend/prisma/schema.prisma'
      - 'Backend/prisma/migrations/**'
      - 'Backend/prisma/baseline/**'
      - 'Backend/scripts/db-bootstrap-empty.mjs'
      - 'Backend/scripts/verify-migration-replay.mjs'
      - 'Backend/src/modules/documents/comparison/**'
      - 'Backend/src/modules/documents/review/**'
      - 'Backend/src/modules/client-publication/**'
      - 'Backend/src/modules/client-identity/**'
      - 'Backend/src/modules/client-interaction/**'
      - 'Backend/src/middleware/clientPortalAuth.ts'
      - 'Backend/tests/**comparison**'
      - 'Backend/tests/**review**'
      - 'Backend/tests/**publication**'
      - 'Backend/tests/**identity**'
      - 'Backend/tests/clientIdentityMembership.integration.test.ts'
      - 'Backend/tests/**Interaction**'
      - 'Backend/tests/**interaction**'
      - 'Backend/package.json'
      - 'Backend/package-lock.json'
      - '.github/workflows/prisma-migration-replayability.yml'
  push:
    branches:
      - release/editor-ops-workflow-1
      - 'codex/**'
    paths:
      - 'Backend/prisma/schema.prisma'
      - 'Backend/prisma/migrations/**'
      - 'Backend/prisma/baseline/**'
      - 'Backend/scripts/db-bootstrap-empty.mjs'
      - 'Backend/scripts/verify-migration-replay.mjs'
      - 'Backend/src/modules/documents/comparison/**'
      - 'Backend/src/modules/documents/review/**'
      - 'Backend/src/modules/client-publication/**'
      - 'Backend/src/modules/client-identity/**'
      - 'Backend/src/modules/client-interaction/**'
      - 'Backend/src/middleware/clientPortalAuth.ts'
      - 'Backend/tests/**comparison**'
      - 'Backend/tests/**review**'
      - 'Backend/tests/**publication**'
      - 'Backend/tests/**identity**'
      - 'Backend/tests/clientIdentityMembership.integration.test.ts'
      - 'Backend/tests/**Interaction**'
      - 'Backend/tests/**interaction**'
      - 'Backend/package.json'
      - 'Backend/package-lock.json'
      - '.github/workflows/prisma-migration-replayability.yml'

jobs:
  replayability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adminiculum_replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Verify canonical empty replay
        working-directory: Backend
        env:
          MIGRATION_REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run db:migrations:verify-replay

      - name: Run comparison PostgreSQL integration tests
        working-directory: Backend
        env:
          COMPARISON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:comparison:db

      - name: Run review PostgreSQL integration tests
        working-directory: Backend
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:review:db

      - name: Run publication PostgreSQL integration tests
        working-directory: Backend
        env:
          PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:publication:db

      - name: Run client identity PostgreSQL integration tests
        working-directory: Backend
        env:
          CLIENT_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:client-identity:db

      - name: Run migration WebJob PostgreSQL tests
        working-directory: Backend
        env:
          WEBJOB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:migration:webjob

      - name: Run client interaction PostgreSQL integration tests
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:client-interaction:db
