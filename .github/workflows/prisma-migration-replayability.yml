name: Prisma Migration Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Backend/prisma/schema.prisma'
      - 'Backend/prisma/migrations/**'
      - 'Backend/prisma/baseline/**'
      - 'Backend/scripts/db-bootstrap-empty.mjs'
      - 'Backend/scripts/verify-migration-replay.mjs'
      - 'Backend/scripts/test-migration-webjob-runner.mjs'
      - 'Backend/App_Data/jobs/triggered/adminiculum-db-migrate/runner.cjs'
      - 'Backend/package.json'
      - 'Backend/package-lock.json'
      - '.github/workflows/prisma-migration-replayability.yml'
  push:
    branches:
      - release/editor-ops-workflow-1
      - 'codex/**'
    paths:
      - 'Backend/prisma/schema.prisma'
      - 'Backend/prisma/migrations/**'
      - 'Backend/prisma/baseline/**'
      - 'Backend/scripts/db-bootstrap-empty.mjs'
      - 'Backend/scripts/verify-migration-replay.mjs'
      - 'Backend/scripts/test-migration-webjob-runner.mjs'
      - 'Backend/App_Data/jobs/triggered/adminiculum-db-migrate/runner.cjs'
      - 'Backend/package.json'
      - 'Backend/package-lock.json'
      - '.github/workflows/prisma-migration-replayability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-gate:
    name: Migration gate (empty replay + webjob)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adminiculum_replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Verify canonical empty migration replay
        working-directory: Backend
        env:
          MIGRATION_REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run db:migrations:verify-replay

      - name: Run migration WebJob runner test
        working-directory: Backend
        env:
          WEBJOB_TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run test:migration:webjob

      - name: Migration gate summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: job } = await github.rest.actions.getJobForRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: context.job,
            });
            const rows = job.steps
              .filter((s) => !['Set up job', 'Complete job'].includes(s.name))
              .map((s) => {
                const result = s.conclusion === 'success' ? 'PASS' : s.conclusion === 'failure' ? 'FAIL' : s.conclusion;
                return `| ${s.name} | ${result} |`;
              })
              .join('\n');
            core.summary.addHeading('Prisma Migration Gate');
            core.summary.addRaw('| Step | Result |\n|------|--------|\n' + rows + '\n');
            core.summary.addRaw('Migration replay runs on an empty schema and applies every post-baseline migration in order. A broken migration MUST fail this gate.');
            await core.summary.write();