name: Backend PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-postgresql-integration.yml'
      - '.github/workflows/prisma-migration-replayability.yml'
  push:
    branches:
      - release/editor-ops-workflow-1
      - 'codex/**'
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-postgresql-integration.yml'
      - '.github/workflows/prisma-migration-replayability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgresql-integration:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adminiculum_replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Provision schema (canonical empty migration replay)
        working-directory: Backend
        env:
          MIGRATION_REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run db:migrations:verify-replay

      - name: Document comparison PG
        working-directory: Backend
        env:
          COMPARISON_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:comparison:db

      - name: Document review PG
        working-directory: Backend
        env:
          REVIEW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:review:db

      - name: Publication PG
        working-directory: Backend
        env:
          PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:publication:db

      - name: Client identity membership PG
        working-directory: Backend
        env:
          CLIENT_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:client-identity:db

      - name: Client interaction PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:client-interaction:db

      - name: CP0 workspace PG
        working-directory: Backend
        env:
          CLIENT_WORKSPACE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:client-workspace:db

      - name: Company foundation PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:company:db

      - name: Contract library PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:contracts:db

      - name: Organization PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:organization:db

      - name: Organization access (CP1) PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:org-access:db

      - name: CP1 external communication / document access PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          CLIENT_PORTAL_READ_ENABLED: 'true'
          CLIENT_PORTAL_ACTIONS_ENABLED: 'true'
          CLIENT_PORTAL_QUESTIONS_ENABLED: 'true'
        run: npm run test:cp1-external-communication-docs:db

      - name: CP1 intake and triage PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          CLIENT_PORTAL_ACTIONS_ENABLED: 'true'
          CLIENT_PORTAL_ORGANIZATIONAL_INTAKE_ENABLED: 'true'
          CLIENT_PORTAL_DATA_REQUESTS_ENABLED: 'true'
          CLIENT_PORTAL_DOCUMENT_UPLOADS_ENABLED: 'true'
        run: npm run test:intake:db

      - name: Client portal membership onboarding PG
        working-directory: Backend
        env:
          CLIENT_IDENTITY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:membership-onboarding:db

      - name: Customer-safe milestone publication PG
        working-directory: Backend
        env:
          PUBLICATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          CLIENT_PORTAL_READ_ENABLED: 'true'
        run: npm run test:milestone:db

      - name: Workflow template + DAG PG
        working-directory: Backend
        env:
          WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:workflow:db

      - name: Workflow completion / forced case-close PG
        working-directory: Backend
        env:
          WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run test:lifecycle:db

      - name: Organization zero-grant PG
        working-directory: Backend
        env:
          CLIENT_INTERACTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npx jest --runInBand tests/clientPortalOrganizationZeroGrant.integration.test.ts

      - name: Backend PostgreSQL integration summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: job } = await github.rest.actions.getJobForRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              job_id: context.job,
            });
            const rows = job.steps
              .filter((s) => !['Set up job', 'Complete job'].includes(s.name))
              .map((s) => {
                const result = s.conclusion === 'success' ? 'PASS' : s.conclusion === 'failure' ? 'FAIL' : s.conclusion;
                return `| ${s.name} | ${result} |`;
              })
              .join('\n');
            core.summary.addHeading('Backend PostgreSQL Integration');
            core.summary.addRaw('| Step | Result |\n|------|--------|\n' + rows + '\n');
            await core.summary.write();