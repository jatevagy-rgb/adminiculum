          sed -i "s/^task-lifecycle-schema=PENDING$/task-lifecycle-schema=$rc/" "$RUNNER_TEMP/ci-suite-results.txt"
          exit "$rc"

      - name: Task review decision PG
        working-directory: Backend
        env:
          TASK_REVIEW_DECISION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_task_review_decision_backend_ci
        run: |
          if npm run test:task-review-decision:db; then
            rc=0
          else
            rc=$?
          fi
          sed -i "s/^task-review-decision=PENDING$/task-review-decision=$rc/" "$RUNNER_TEMP/ci-suite-results.txt"
          exit "$rc"

      - name: Task submission PG
        working-directory: Backend
        env:
          TASK_SUBMISSION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_task_submission_backend_ci
        run: |
          if npm run test:task-submission:db; then
            rc=0
          else
            rc=$?
          fi
          sed -i "s/^task-submission=PENDING$/task-submission=$rc/" "$RUNNER_TEMP/ci-suite-results.txt"
          exit "$rc"

      - name: Backend PostgreSQL integration summary
        if: always()
        continue-on-error: true
        run: |
          declare -A names=(
            [comparison]="Document comparison"
            [review]="Document review"
            [publication]="Publication"
            [internal-case-portal-publication]="Internal Case explicit portal publication"
            [identity]="Client identity membership"
            [interaction]="Client interaction"
            [workspace]="CP0 workspace"
            [company]="Company foundation"
            [contracts]="Contract library"
            [organization]="Organization"
            [org-access]="Organization access (CP1)"
            [cp1-external]="CP1 external communication / document access"
            [intake]="CP1 intake and triage"
            [onboarding]="Client portal membership onboarding"
            [milestone]="Customer-safe milestone publication"
            [workflow]="Workflow template + DAG"
            [lifecycle]="Workflow completion / forced case-close"
            [zero-grant]="Organization zero-grant"
            [phase5-fixture]="Phase 5 org-portal fixture foundation"
            [phase6-slice-a]="Phase 6 Slice A foundation"
            [phase6-slice-b]="Phase 6 Slice B requirement/rule foundation"
            [phase6-slice-c2]="Phase 6 Slice C2 evaluation orchestration"
            [phase6-slice-d]="Phase 6 Slice D immutable applicability snapshot"
            [phase7-slice-7a]="Phase 7 Slice 7A finding materialization"
            [phase7d]="Phase 7D typed fact to finding automation"
            [answer-state]="Organization client AnswerState / Discovery"
            [case-attention]="Case attention read model"
            [client-safe-work-summary]="Client-safe recorded work summary"
            [client-communication-summary]="Contextual client communication summary"
            [demo-kft-text-id-verification]="Demo Kft text-ID verification"
            [demo-kft-identity-binding]="Demo Kft identity binding"
            [agenda-deadline]="Agenda deadline recovery"
            [work-package-schema]="WP-1 work package schema foundation"
            [work-package-admin]="WP-2 work package administration"
            [work-package-case-creation]="WP-3 case creation work package integration"
            [intake-work-package]="Intake Work Package unification"
            [time-billing-convergence]="Time to billing preparation to client reporting convergence"
            [work-package-operational]="Work package operational runtime"
            [phase7b]="Phase 7B compliance proposal workflow"
            [phase7cb]="Phase 7C-B compliance overview"
            [org-client-safe]="Org client safe compliance read model"
            [phase5b]="Phase 5B org contract + company customer surface"
            [document-version]="Document version persistence"
            [task-lifecycle-schema]="Task lifecycle additive schema"
            [task-review-decision]="Task review decision"
            [task-submission]="Task submission"
          )
          {
            echo "### Backend PostgreSQL Integration"
            echo
            echo "| Suite | Result |"
            echo "|-------|--------|"
            while IFS='=' read -r key rc; do
              if [ "$rc" = "0" ]; then
                res=":white_check_mark: PASS"
              elif [ "$rc" = "PENDING" ]; then
                res=":heavy_minus_sign: SKIPPED (prior failure)"
              else
                res=":x: FAIL"
              fi
              echo "| ${names[$key]:-$key} | $res |"
            done < "$RUNNER_TEMP/ci-suite-results.txt"
          } >> "$GITHUB_STEP_SUMMARY"
