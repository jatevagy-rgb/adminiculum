name: Backend PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-postgresql-integration.yml'
      - '.github/workflows/prisma-migration-replayability.yml'
  push:
    branches:
      - release/editor-ops-workflow-1
      - 'codex/**'
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-postgresql-integration.yml'
      - '.github/workflows/prisma-migration-replayability.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgresql-integration:
    name: Backend PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adminiculum_replay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      - name: Provision schema (canonical empty migration replay)
        working-directory: Backend
        env:
          MIGRATION_REPLAY_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: npm run db:migrations:verify-replay

      - name: Provision task/document dedicated DBs (canonical schema copies)
        working-directory: Backend
        env:
          PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm run db:provision:task-document

      - name: Initialize suite result tracking
        run: |
          for s in comparison review publication internal-case-portal-publication identity interaction workspace company contracts organization org-access cp1-external intake onboarding milestone workflow lifecycle zero-grant phase5-fixture phase6-slice-a phase6-slice-b phase6-slice-c2 phase6-slice-d phase7-slice-7a phase7d answer-state case-attention client-safe-work-summary client-communication-summary demo-kft-text-id-verification demo-kft-identity-binding work-package-schema work-package-admin work-package-case-creation work-package-operational intake-work-package time-attribution time-billing-convergence phase7b phase7cb org-client-safe phase5b document-version task-lifecycle-schema task-review-decision task-submission agenda-deadline; do
            echo "$s=PENDING" >> "$RUNNER_TEMP/ci-suite-results.txt"
          done

      - name: Demo Kft text-ID verification PG
        working-directory: Backend
        env:
          DEMO_KFT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: |
          if npx jest --runInBand tests/demoKftTextIdVerification.integration.test.ts; then rc=0; else rc=$?; fi
          sed -i "s/^demo-kft-text-id-verification=PENDING$/demo-kft-text-id-verification=$rc/" "$RUNNER_TEMP/ci-suite-results.txt"
          exit $rc

      - name: Demo Kft identity binding PG
        working-directory: Backend
        env:
          DEMO_KFT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adminiculum_replay_ci?schema=public
        run: |
          if npx jest --runInBand tests/demoKftIdentityBinding.integration.test.ts; then rc=0; else rc=$?; fi
          sed -i "s/^demo-kft-identity-binding=PENDING$/demo-kft-identity-binding=$rc/" "$RUNNER_TEMP/ci-suite-results.txt"
